<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>O Penitente - A GitHub Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a24; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        #ui-overlay { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 15px 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); pointer-events: none; z-index: 10; width: 620px;}
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ffd700; letter-spacing: 1px; text-transform: uppercase;}
        p { margin: 0; font-size: 14px; color: #aaa; line-height: 1.8;}
        .key { background: #333; padding: 2px 8px; border-radius: 4px; color: #fff; font-weight: bold; border-bottom: 2px solid #111;}
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        /* Estilo do Menu de Inventário */
        #inventory-menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 15, 10, 0.95); border: 2px solid #b8860b;
            border-radius: 8px; padding: 20px; width: 400px; display: none;
            color: #eeddcc; z-index: 20; box-shadow: 0 0 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }
        #inventory-menu h2 { margin: 0 0 15px 0; font-size: 16px; color: #ffd700; border-bottom: 1px solid #554433; padding-bottom: 10px; text-align: center; }
        .grid-inv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .slot { background: rgba(255,255,255,0.05); aspect-ratio: 1; border: 1px solid #554433; border-radius: 4px; position: relative; transition: 0.2s; cursor: pointer; }
        .slot:hover { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .mock-item { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; }

        /* Sistema de Equipamentos na HUD */
        #gear-panel { position: absolute; top: 20px; right: 20px; background: rgba(15, 15, 20, 0.85); padding: 15px; border: 1px solid #554433; border-radius: 8px; color: #ffd700; font-size: 14px; z-index: 10; backdrop-filter: blur(5px); }
        .gear-btn { width: 100%; margin-top: 8px; padding: 8px; background: #2a2a35; color: white; border: 1px solid #445; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .gear-btn:hover { background: #ffd700; color: black; border-color: #fff;}
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="crosshair"></div>
    
    <!-- Painel de Equipamentos para Escalar o visual -->
    <div id="gear-panel">
        <div style="text-align: center; border-bottom: 1px solid #554433; padding-bottom: 5px; margin-bottom: 10px;"><strong>🛠️ Slots de Equip.</strong></div>
        <button class="gear-btn" onclick="toggleHead()">Trocar Capacete / Cabelo</button>
        <button class="gear-btn" onclick="toggleArmor()">Trocar Armadura</button>
        <button class="gear-btn" onclick="toggleWeapon()">Trocar Arma</button>
    </div>

    <div id="inventory-menu">
        <h2>🎒 Alforje do Purgatório</h2>
        <div class="grid-inv">
            <div class="slot"><span class="mock-item">🪵</span></div><div class="slot"><span class="mock-item">💎</span></div><div class="slot"><span class="mock-item">🌿</span></div><div class="slot"><span class="mock-item">🧪</span></div><div class="slot"><span class="mock-item">🍖</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
    </div>

    <div id="ui-overlay">
        <h1>O Penitente - A GitHub Odyssey</h1>
        <p>
            <span class="key">WASD</span> Mover | <span class="key">Espaço</span> Pular | <span class="key">Shift</span> Correr | <span class="key">F</span> Receber Dano <br>
            <span class="key">Click Esq</span> Atacar | <span class="key">Click Dir (Segurar)</span> Defender | <span class="key">I</span> Inventário | <span class="key">H</span> Ocultar HUD <br>
            <span class="key">Z</span> Sentar | <span class="key">X</span> Dormir | <span class="key">C</span> Comer | <span class="key">V</span> Beber
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 0. GERADOR DE TEXTURAS PROCEDURAIS ---
        function createBumpTexture(type, size = 256) {
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d'); const imgData = ctx.createImageData(size, size);
            for (let i = 0; i < imgData.data.length; i += 4) {
                let val = 128;
                if (type === 'leather') val += (Math.random() * 80) - 40;
                else if (type === 'hair') { val += (Math.sin(Math.floor((i / 4) / size) * 0.5) * 40) + (Math.random() * 30) - 15; }
                else if (type === 'cloth') { val += (Math.sin((i / 4) % size) * 20) + (Math.cos(Math.floor((i / 4) / size)) * 20); }
                imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = val; imgData.data[i+3] = 255; 
            }
            ctx.putImageData(imgData, 0, 0); const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        const texLeatherBump = createBumpTexture('leather'); const texHairBump = createBumpTexture('hair', 128); const texClothBump = createBumpTexture('cloth', 128);

        // 1. CENA E CÂMERA
        const scene = new THREE.Scene(); scene.background = new THREE.Color('#211e29'); scene.fog = new THREE.FogExp2('#211e29', 0.02);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 8, 20);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.05; controls.target.set(0, 4, 0); controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // 2. ILUMINAÇÃO
        const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x444455, 0.6); hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2); dirLight.position.set(10, 20, 10); dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        const d = 15; dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d; dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d; scene.add(dirLight);

        // 3. AMBIENTE
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x30353a, roughness: 0.9, bumpMap: texLeatherBump, bumpScale: 0.05 });
        const ground = new THREE.Mesh(new THREE.CylinderGeometry(25, 20, 2, 24), groundMat); ground.position.y = -1; ground.receiveShadow = true; scene.add(ground);
        const lakeCenter = { x: 10, z: -8 }; const lakeRadius = 5.5;
        const poolWall = new THREE.Mesh(new THREE.TorusGeometry(lakeRadius, 0.8, 16, 32), new THREE.MeshStandardMaterial({ color: 0x1f2326, roughness: 0.9 }));
        poolWall.rotation.x = Math.PI / 2; poolWall.position.set(lakeCenter.x, 0.2, lakeCenter.z); poolWall.receiveShadow = true; scene.add(poolWall);
        const lake = new THREE.Mesh(new THREE.CylinderGeometry(lakeRadius, lakeRadius, 1.5, 32), new THREE.MeshStandardMaterial({ color: 0x1177aa, transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.2 }));
        lake.position.set(lakeCenter.x, -0.2, lakeCenter.z); lake.receiveShadow = true; scene.add(lake);

        // 4. MATERIAIS DOS PERSONAGENS
        const baseParams = { flatShading: true, roughness: 0.8, metalness: 0.1 };
        const matSkin = new THREE.MeshStandardMaterial({ color: 0xffccaa, ...baseParams });
        const matSkinDark = new THREE.MeshStandardMaterial({ color: 0xe0a080, ...baseParams });
        const matHair = new THREE.MeshStandardMaterial({ color: 0x4a2a18, ...baseParams, bumpMap: texHairBump, bumpScale: 0.08 }); 
        const matArmor = new THREE.MeshStandardMaterial({ color: 0x5a3a29, ...baseParams, bumpMap: texLeatherBump, bumpScale: 0.1 });
        const matLeatherDark = new THREE.MeshStandardMaterial({ color: 0x332015, ...baseParams, bumpMap: texLeatherBump, bumpScale: 0.1 });
        const matShirt = new THREE.MeshStandardMaterial({ color: 0x18181a, ...baseParams, bumpMap: texClothBump, bumpScale: 0.05 });
        const matGreen = new THREE.MeshStandardMaterial({ color: 0x226622, ...baseParams, bumpMap: texClothBump, bumpScale: 0.05 }); 
        const matGold = new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.7, roughness: 0.3, flatShading: true });
        const matEyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, ...baseParams });
        const matEyeIris = new THREE.MeshStandardMaterial({ color: 0x0a9922, ...baseParams });
        const matEyePupil = new THREE.MeshStandardMaterial({ color: 0x000000, ...baseParams });
        const matEyeShine = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const matMouth = new THREE.MeshStandardMaterial({ color: 0x2a1005, ...baseParams });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.3, flatShading: true });

        function createPart(geo, mat, x, y, z, rx=0, ry=0, rz=0, parent) {
            const mesh = new THREE.Mesh(geo, mat); mesh.position.set(x, y, z); mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true; mesh.receiveShadow = true; if(parent) parent.add(mesh); return mesh;
        }

        // 5. CONSTRUÇÃO DO PENITENTE (CORE)
        const penitente = new THREE.Group(); scene.add(penitente);
        const bodyGroup = new THREE.Group(); penitente.add(bodyGroup);

        // TORSO BASE (Skin/Under-shirt)
        const torso = createPart(new THREE.CylinderGeometry(0.75, 0.8, 1.6, 10), matShirt, 0, 2.5, 0, 0, 0, 0, bodyGroup);
        torso.scale.set(1.2, 1, 0.95);
        
        // SLOTS DE EQUIPAMENTO (A base do sistema de escalabilidade)
        const slotHead = new THREE.Group(); 
        const slotArmor = new THREE.Group(); torso.add(slotArmor);
        const slotWeapon = new THREE.Group(); 
        const slotShield = new THREE.Group();

        // ---------------- WARDROBE / ITENS DE VESTUÁRIO ----------------

        // ARMADURA 1: Couro (Clássica)
        const armorLeatherGroup = new THREE.Group();
        createPart(new THREE.CylinderGeometry(0.82, 0.85, 1.55, 10, 1, false, Math.PI * 0.15, Math.PI * 1.7), matArmor, 0, 0, 0, 0, 0, 0, armorLeatherGroup);
        createPart(new THREE.BoxGeometry(0.6, 0.2, 0.8), matArmor, -0.4, 0.75, 0, 0, 0, -0.2, armorLeatherGroup);
        createPart(new THREE.BoxGeometry(0.6, 0.2, 0.8), matArmor, 0.4, 0.75, 0, 0, 0, 0.2, armorLeatherGroup);
        const coatGroup = new THREE.Group(); coatGroup.position.set(0, -0.85, 0); armorLeatherGroup.add(coatGroup);
        const animatedCoat = []; const flapGeo = new THREE.BoxGeometry(0.45, 1.4, 0.08); flapGeo.translate(0, -0.7, 0); 
        for (let i = 0; i < 12; i++) { 
            const angle = (i / 12) * Math.PI * 2; const x = Math.sin(angle) * 0.88; const z = Math.cos(angle) * 0.88; 
            if (z > 0.4 && Math.abs(x) < 0.6) continue; 
            const flap = createPart(flapGeo, matLeatherDark, x, 0, z, 0.1, angle, 0, coatGroup);
            animatedCoat.push({ mesh: flap, baseRx: 0.1, baseRy: angle, offset: i * 0.2 });
        }

        // ARMADURA 2: Aço Pesado (Nova!)
        const armorSteelGroup = new THREE.Group();
        createPart(new THREE.CylinderGeometry(0.88, 0.9, 1.6, 8), matSteel, 0, 0, 0, 0, 0, 0, armorSteelGroup);
        createPart(new THREE.BoxGeometry(1.0, 0.3, 1.0), matSteel, 0, 0.75, 0, 0, 0, 0, armorSteelGroup); // Ombreiras coladas
        createPart(new THREE.CylinderGeometry(0.95, 0.95, 0.4, 12), matLeatherDark, 0, -0.6, 0, 0, 0, 0, armorSteelGroup); // Cinto extra

        // CINTO FIXO COM BOLSAS E LAMPIÃO (Para manter utilidades em qualquer armadura)
        const belt = createPart(new THREE.CylinderGeometry(0.92, 0.92, 0.3, 12), matLeatherDark, 0, -0.7, 0, 0, 0, 0, torso);
        createPart(new THREE.BoxGeometry(0.5, 0.4, 0.2), matGold, 0, 0, 0.9, 0, 0, 0, belt); 
        createPart(new THREE.BoxGeometry(0.25, 0.25, 0.25), matEyeIris, 0, 0, 0.95, 0, 0, 0, belt); 
        const pouchPivot = new THREE.Group(); pouchPivot.position.set(-0.75, -0.1, 0.6); pouchPivot.rotation.z = 0.2; belt.add(pouchPivot);
        createPart(new THREE.IcosahedronGeometry(0.35, 1), matGreen, 0, -0.3, 0, 0, 0, 0, pouchPivot); 
        const lanternPivot = new THREE.Group(); lanternPivot.position.set(0.75, -0.2, 0.5); belt.add(lanternPivot);
        createPart(new THREE.CylinderGeometry(0.12, 0.12, 0.05, 6), matSteel, 0, 0.2, 0, 0, 0, 0, lanternPivot);
        createPart(new THREE.CylinderGeometry(0.1, 0.1, 0.05, 6), matSteel, 0, -0.2, 0, 0, 0, 0, lanternPivot);
        const matFire = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        createPart(new THREE.CylinderGeometry(0.08, 0.08, 0.35, 6), matFire, 0, 0, 0, 0, 0, 0, lanternPivot); 
        const lanternLight = new THREE.PointLight(0xffaa00, 2, 12); lanternLight.position.set(0, 0, 0); lanternPivot.add(lanternLight);
        penitente.userData.lanternLight = lanternLight;

        // --- CABEÇA ---
        const headPivot = new THREE.Group(); headPivot.position.set(0, 3.5, 0); bodyGroup.add(headPivot);
        const head = createPart(new THREE.IcosahedronGeometry(0.9, 2), matSkin, 0, 0.5, 0, 0, 0, 0, headPivot);
        head.scale.set(1.15, 1.2, 1.15); 
        createPart(new THREE.SphereGeometry(0.2, 8, 8), matSkin, -1.0, 0.3, 0, 0, 0, 0, headPivot);
        createPart(new THREE.SphereGeometry(0.2, 8, 8), matSkin, 1.0, 0.3, 0, 0, 0, 0, headPivot);
        createPart(new THREE.IcosahedronGeometry(0.12, 1), matSkinDark, 0, 0.15, 1.02, 0, 0, 0, headPivot).scale.set(1, 0.8, 1);
        const mouth = createPart(new THREE.BoxGeometry(0.25, 0.04, 0.1), matMouth, 0, 0.0, 0.95, 0, 0, 0.05, headPivot);

        // Olhos
        const eyeL = new THREE.Group(); eyeL.position.set(-0.35, 0.35, 0.92); headPivot.add(eyeL);
        const eyeR = new THREE.Group(); eyeR.position.set(0.35, 0.35, 0.92); headPivot.add(eyeR);
        function buildEye(parent) {
            createPart(new THREE.BoxGeometry(0.3, 0.38, 0.1), matEyeWhite, 0, 0, 0, 0, 0, 0, parent); 
            createPart(new THREE.BoxGeometry(0.2, 0.28, 0.12), matEyeIris, 0, 0, 0, 0, 0, 0, parent); 
            createPart(new THREE.BoxGeometry(0.12, 0.18, 0.14), matEyePupil, 0, 0, 0, 0, 0, 0, parent); 
            createPart(new THREE.BoxGeometry(0.04, 0.04, 0.16), matEyeShine, 0.04, 0.06, 0, 0, 0, 0, parent); 
        }
        buildEye(eyeL); buildEye(eyeR);

        const browL = createPart(new THREE.BoxGeometry(0.35, 0.12, 0.25), matHair, -0.32, 0.62, 1.05, 0.1, 0, -0.25, headPivot);
        const browR = createPart(new THREE.BoxGeometry(0.35, 0.12, 0.25), matHair, 0.32, 0.62, 1.05, 0.1, 0, 0.25, headPivot);

        headPivot.add(slotHead); // Slot conectado na cabeça

        // CABEÇA 1: Cabelo Dinâmico (Clássico)
        const hairGroup = new THREE.Group(); hairGroup.position.set(0, 0.6, 0);
        const animatedHair = [];
        createPart(new THREE.SphereGeometry(1.0, 16, 16, 0, Math.PI*2, 0, Math.PI/1.5), matHair, 0, 0.1, -0.1, 0, 0, 0, hairGroup).scale.set(1.1, 1.05, 1.1);
        const lockGeo = new THREE.ConeGeometry(0.25, 1.4, 4); lockGeo.translate(0, 0.7, 0); 
        for (let i = 0; i < 95; i++) { 
            const angle = Math.random() * Math.PI * 2; const radius = Math.sqrt(Math.random()) * 1.05; 
            const x = Math.sin(angle) * radius; const z = Math.cos(angle) * radius;
            let y = 0.2 + Math.sqrt(Math.max(0, 1.1 - radius*radius)) * 0.75; 
            let rx = 0; let rz = 0; let isBangs = false; let size = 0.6 + Math.random() * 0.6; 
            if (z > 0.4 && y < 0.8) { isBangs = true; rx = 1.7 + (Math.random() - 0.5) * 0.4; rz = (x * -0.5); size *= 0.9; } 
            else if (z < -0.3) { rx = -1.0 + (Math.random() - 0.5) * 0.5; rz = (x * -0.5); size *= 0.8; } 
            else if (radius > 0.7) { rx = (z * -0.5) + (Math.random() - 0.5) * 0.3; rz = (x < 0 ? 1.2 : -1.2) + (Math.random() - 0.5) * 0.3; } 
            else { rx = (Math.random() - 0.5) * 0.6; rz = (Math.random() - 0.5) * 0.6; size *= 1.3; }
            if (z > 0.8 && Math.abs(x) < 0.4 && y < 0.5) continue; 
            const mesh = createPart(lockGeo, matHair, x, y, z, rx, 0, rz, hairGroup); mesh.scale.set(size, size, size);
            animatedHair.push({ mesh, baseRx: rx, baseRz: rz, offset: i * 0.1, reactionStrength: isBangs ? 1.5 : (0.8 + (i % 5) * 0.2), isBangs: isBangs });
        }

        // CABEÇA 2: Capacete de Ferro Fechado com Chifres (Novo!)
        const helmetGroup = new THREE.Group(); helmetGroup.position.set(0, 0.2, 0);
        createPart(new THREE.CylinderGeometry(1.05, 1.05, 1.4, 16), matSteel, 0, 0.3, 0, 0, 0, 0, helmetGroup); // Cilindro cobrindo o rosto
        createPart(new THREE.SphereGeometry(1.05, 16, 16, 0, Math.PI*2, 0, Math.PI/2), matSteel, 0, 1.0, 0, 0, 0, 0, helmetGroup); // Cúpula
        const matVisor = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 }); // Visor escuro
        createPart(new THREE.BoxGeometry(1.2, 0.2, 1.05), matVisor, 0, 0.45, 0.15, 0, 0, 0, helmetGroup); // Fenda dos olhos
        createPart(new THREE.ConeGeometry(0.2, 0.8, 6), matLeatherDark, -1.0, 0.8, 0, -0.2, 0, 0.6, helmetGroup); // Chifre Esq
        createPart(new THREE.ConeGeometry(0.2, 0.8, 6), matLeatherDark, 1.0, 0.8, 0, -0.2, 0, -0.6, helmetGroup); // Chifre Dir

        // --- BRAÇOS E PERNAS ---
        const shoulderL = new THREE.Group(); shoulderL.position.set(-1.35, 3.0, 0); bodyGroup.add(shoulderL);
        const shoulderR = new THREE.Group(); shoulderR.position.set(1.35, 3.0, 0); bodyGroup.add(shoulderR);
        const elbowL = new THREE.Group(); elbowL.position.set(0, -0.7, 0); shoulderL.add(elbowL);
        const elbowR = new THREE.Group(); elbowR.position.set(0, -0.7, 0); shoulderR.add(elbowR);

        createPart(new THREE.SphereGeometry(0.45, 10, 10, 0, Math.PI * 2, 0, Math.PI/2), matArmor, 0, 0.1, 0, 0, 0, 0, shoulderL);
        createPart(new THREE.SphereGeometry(0.45, 10, 10, 0, Math.PI * 2, 0, Math.PI/2), matArmor, 0, 0.1, 0, 0, 0, 0, shoulderR);
        createPart(new THREE.CylinderGeometry(0.28, 0.25, 0.8, 8), matShirt, 0, -0.3, 0, 0, 0, 0, shoulderL);
        createPart(new THREE.CylinderGeometry(0.28, 0.25, 0.8, 8), matShirt, 0, -0.3, 0, 0, 0, 0, shoulderR);
        createPart(new THREE.CylinderGeometry(0.28, 0.24, 0.7, 8), matLeatherDark, 0, -0.3, 0, 0, 0, 0, elbowL);
        createPart(new THREE.CylinderGeometry(0.28, 0.24, 0.7, 8), matLeatherDark, 0, -0.3, 0, 0, 0, 0, elbowR);
        
        const handL = createPart(new THREE.IcosahedronGeometry(0.3, 1), matSkin, 0, -0.75, 0, 0, 0, 0, elbowL);
        const handR = createPart(new THREE.IcosahedronGeometry(0.3, 1), matSkin, 0, -0.75, 0, 0, 0, 0, elbowR);

        handR.add(slotWeapon);
        handL.add(slotShield);

        // ARMA 1: Espada de Ferro
        const swordGroup = new THREE.Group(); swordGroup.position.set(0, -0.1, 0.2); swordGroup.rotation.x = Math.PI / 2; 
        createPart(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6), matLeatherDark, 0, -0.2, 0, 0, 0, 0, swordGroup); 
        createPart(new THREE.BoxGeometry(0.5, 0.1, 0.15), matGold, 0, 0.1, 0, 0, 0, 0, swordGroup); 
        createPart(new THREE.BoxGeometry(0.15, 1.4, 0.05), matSteel, 0, 0.85, 0, 0, 0, 0, swordGroup); 
        const swordTip = createPart(new THREE.ConeGeometry(0.075, 0.3, 4).rotateY(Math.PI/4), matSteel, 0, 1.7, 0, 0, 0, 0, swordGroup);

        // ARMA 2: Machado Pesado (Novo!)
        const axeGroup = new THREE.Group(); axeGroup.position.set(0, -0.1, 0.2); axeGroup.rotation.x = Math.PI / 2; 
        createPart(new THREE.CylinderGeometry(0.06, 0.06, 1.5, 6), matLeatherDark, 0, 0.5, 0, 0, 0, 0, axeGroup); // Cabo longo
        createPart(new THREE.BoxGeometry(0.6, 0.5, 0.1), matSteel, 0.2, 1.0, 0, 0, 0, 0, axeGroup); // Lâmina Larga
        createPart(new THREE.ConeGeometry(0.1, 0.4, 4), matSteel, -0.2, 1.0, 0, 0, 0, Math.PI/2, axeGroup); // Espigão traseiro

        // ESCUDO
        const shieldGroup = new THREE.Group(); shieldGroup.position.set(-0.2, -0.1, 0.3); shieldGroup.rotation.y = -Math.PI / 2; 
        createPart(new THREE.CylinderGeometry(0.55, 0.55, 0.1, 14), matLeatherDark, 0, 0, 0, Math.PI/2, 0, 0, shieldGroup);

        // 8. GAME LOOP
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            let isMoving = false;

            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
            const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
            
            const distToLake = Math.hypot(penitente.position.x - lakeCenter.x, penitente.position.z - lakeCenter.z);
            const isInLakeRadius = distToLake < lakeRadius;
            
            let speed = keys.shift ? 14 : 7; 
            if (isDefending) speed = keys.shift ? 6 : 3; 
            if (isSwimming) speed = 5; 

            const isResting = actionState === 'sit' || actionState === 'sleep' || actionState === 'inventory' || actionState === 'damage';
            const canMove = !(isAttacking && isGrounded && !isSwimming) && !isResting;

            let moveX = 0; let moveZ = 0;
            if (canMove) {
                if (keys.w) { moveX += camDir.x; moveZ += camDir.z; }
                if (keys.s) { moveX -= camDir.x; moveZ -= camDir.z; }
                if (keys.a) { moveX -= camRight.x; moveZ -= camRight.z; }
                if (keys.d) { moveX += camRight.x; moveZ += camRight.z; }
            }

            const moveVec = new THREE.Vector3(moveX, 0, moveZ);
            
            if (moveVec.lengthSq() > 0) {
                moveVec.normalize().multiplyScalar(speed * delta);
                const nextPos = penitente.position.clone().add(moveVec);
                const nextDist = Math.hypot(nextPos.x - lakeCenter.x, nextPos.z - lakeCenter.z);
                if (nextDist > lakeRadius && nextDist < lakeRadius + 1.2 && penitente.position.y < 1.0) moveVec.set(0, 0, 0); 
            }

            if (moveVec.lengthSq() > 0) {
                isMoving = true;
                if (!isDefending || isSwimming) {
                    const targetAngle = Math.atan2(moveVec.x, moveVec.z);
                    let diff = targetAngle - penitente.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
                    penitente.rotation.y += diff * 12 * delta;
                } else if (isDefending) {
                     const targetAngle = Math.atan2(moveVec.x, moveVec.z);
                     let diff = targetAngle - penitente.rotation.y;
                     while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
                     penitente.rotation.y += diff * 4 * delta;
                }
                penitente.position.add(moveVec);
            }

            // FÍSICA VERTICAL
            const waterSurface = 0.55; let isSwimmingState = false;

            if (isDefending && !wasDefending && isGrounded) {
                spawnVFX(penitente.position, 'dust', 8);
                const shieldPos = new THREE.Vector3(); slotShield.getWorldPosition(shieldPos); spawnVFX(shieldPos, 'slash', 6);
            }
            wasDefending = isDefending;

            penitente.position.y += velocityY * delta;

            if (isInLakeRadius) {
                if (penitente.position.y > waterSurface) { velocityY -= 40 * delta; } 
                else { isSwimmingState = true; penitente.position.y = waterSurface; velocityY = 0; isGrounded = true; }
            } else {
                velocityY -= 60 * delta; 
                if (penitente.position.y <= 0) { penitente.position.y = 0; velocityY = 0; isGrounded = true; }
            }
            
            if (isGrounded && !wasGrounded && !isSwimming) {
                if (prevVelocityY < -10) { spawnVFX(penitente.position, 'dust', 12); }
            }
            wasGrounded = isGrounded; prevVelocityY = velocityY;
            isSwimming = isSwimmingState; 
            
            const targetCamPos = penitente.position.clone().add(new THREE.Vector3(0, 8, 15));
            camera.position.lerp(targetCamPos, 5 * delta);
            controls.target.lerp(penitente.position.clone().add(new THREE.Vector3(0, 4, 0)), 10 * delta);

            if (penitente.userData.lanternLight) penitente.userData.lanternLight.intensity = 1.2 + Math.random() * 0.8;

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.userData.life -= delta * (p.userData.type === 'slash' ? 3.0 : 1.5);
                p.position.add(p.userData.vel.clone().multiplyScalar(delta));
                if (p.userData.type === 'slash') p.scale.setScalar(Math.max(0, p.userData.life)); 
                else { p.position.y += delta * 1.5; p.scale.setScalar(Math.max(0, p.userData.life * 1.5)); }
                if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }

            updateAnimations(delta, isMoving, speed);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
