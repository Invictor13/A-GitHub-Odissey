<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Goblin Saqueador - A GitHub Odyssey</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #0d0f12; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #ui-overlay { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(12, 16, 20, 0.88); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(74, 124, 57, 0.3); 
            color: white; 
            padding: 16px 24px; 
            border-radius: 14px; 
            text-align: center; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); 
            pointer-events: auto; 
            z-index: 10; 
            width: 92%;
            max-width: 680px;
        }

        h1 { margin: 0 0 4px 0; font-size: 19px; color: #7ec850; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; text-shadow: 0 0 10px rgba(126, 200, 80, 0.4); }
        p.subtitle { margin: 0 0 12px 0; font-size: 13px; color: #a0b298; }
        
        .action-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
        .btn {
            background: #1c2719;
            border: 1px solid #4a7c39;
            color: #d2e8c4;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover { background: #325426; color: #fff; border-color: #7ec850; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(126,200,80,0.3); }
        .btn:active { transform: translateY(1px); }

        /* Controles Virtuais D-Pad */
        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 10px;
            gap: 15px;
        }

        .dpad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .dpad-row {
            display: flex;
            gap: 3px;
        }
        .dpad-btn {
            width: 32px;
            height: 32px;
            background: #1c2719;
            border: 1px solid #4a7c39;
            color: #7ec850;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #7ec850;
            color: #0d0f12;
        }

        .controls-hint { 
            display: flex; 
            flex-direction: column;
            gap: 4px;
            font-size: 11px; 
            color: #7e8d77; 
            text-align: left;
        }
        .key { background: #222d1f; color: #9bc683; padding: 2px 6px; border-radius: 4px; border: 1px solid #3d5a32; font-family: monospace; font-weight: bold; }

        #audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(12, 16, 20, 0.85);
            border: 1px solid rgba(74, 124, 57, 0.4);
            color: #7ec850;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
            font-size: 13px;
            backdrop-filter: blur(8px);
        }

        #badge-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(12, 16, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 8px 14px;
            border-radius: 8px;
            z-index: 10;
            font-size: 12px;
            backdrop-filter: blur(8px);
        }
        #badge-info strong { color: #7ec850; }
    </style>

    <!-- Three.js e OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="badge-info">
        Inimigo: <strong>Goblin Saqueador</strong> | Malha 3D Reativa
    </div>

    <button id="audio-toggle">🔊 Áudio: ON</button>

    <div id="ui-overlay">
        <h1>Goblin Saqueador</h1>
        <p class="subtitle">A GitHub Odyssey — Galeria de Modelos 3D</p>
        
        <div class="action-bar">
            <button class="btn" onclick="triggerAnimation('idle')">Parado</button>
            <button class="btn" onclick="triggerAnimation('run')">Trote / Corrida</button>
            <button class="btn" onclick="triggerAnimation('attack')">Ataque de Adaga</button>
            <button class="btn" onclick="triggerAnimation('taunt')">Provocar</button>
            <button class="btn" onclick="triggerAnimation('hit')">Receber Dano</button>
            <button class="btn" onclick="triggerJump()">Pular</button>
        </div>

        <div class="controls-wrapper">
            <div class="controls-hint">
                <span><span class="key">WASD</span> / <span class="key">Setas</span> Mover Goblin</span>
                <span><span class="key">Espaço</span> Pular | <span class="key">J</span> Atacar</span>
                <span><span class="key">K</span> Provocar | <span class="key">L</span> Dano</span>
            </div>

            <!-- D-Pad Virtual de Movimentação -->
            <div class="dpad-container">
                <button class="dpad-btn" id="btn-up" onpointerdown="setVirtualKey('up', true)" onpointerup="setVirtualKey('up', false)" onpointerleave="setVirtualKey('up', false)">▲</button>
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-left" onpointerdown="setVirtualKey('left', true)" onpointerup="setVirtualKey('left', false)" onpointerleave="setVirtualKey('left', false)">◄</button>
                    <button class="dpad-btn" id="btn-down" onpointerdown="setVirtualKey('down', true)" onpointerup="setVirtualKey('down', false)" onpointerleave="setVirtualKey('down', false)">▼</button>
                    <button class="dpad-btn" id="btn-right" onpointerdown="setVirtualKey('right', true)" onpointerup="setVirtualKey('right', false)" onpointerleave="setVirtualKey('right', false)">►</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SINTETIZADOR DE ÁUDIO PROCEDURAL (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playStep() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120 + Math.random() * 40, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playAttack() {
                if (!this.enabled || !this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.18;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(400, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1800, this.ctx.currentTime + 0.12);
                
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();

                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(700, this.ctx.currentTime + 0.1);
                osc.frequency.linearRampToValueAtTime(300, this.ctx.currentTime + 0.2);
                oscGain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playTaunt() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                for (let i = 0; i < 3; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    const startTime = now + i * 0.12;
                    osc.frequency.setValueAtTime(500 + i * 150, startTime);
                    osc.frequency.exponentialRampToValueAtTime(300, startTime + 0.1);
                    gain.gain.setValueAtTime(0.12, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.1);
                }
            }

            playHit() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
        }

        const audio = new SoundFX();
        const audioBtn = document.getElementById('audio-toggle');
        audioBtn.addEventListener('click', () => {
            audio.init();
            audio.enabled = !audio.enabled;
            audioBtn.innerText = audio.enabled ? '🔊 Áudio: ON' : '🔇 Áudio: OFF';
        });

        // --- GERADORES DE TEXTURA PROCEDURAL ---
        function createPixelTexture(baseHex, detailHex, size = 64, noiseDensity = 0.25) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, size, size);

            const grid = 4;
            for (let x = 0; x < size; x += grid) {
                for (let y = 0; y < size; y += grid) {
                    if (Math.random() < noiseDensity) {
                        ctx.fillStyle = detailHex;
                        ctx.globalAlpha = 0.15 + Math.random() * 0.35;
                        ctx.fillRect(x, y, grid, grid);
                    }
                }
            }
            ctx.globalAlpha = 1.0;

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // Criar texturas específicas
        const skinTex = createPixelTexture('#4a7c39', '#2d5221', 64, 0.4); 
        const clothTex = createPixelTexture('#594333', '#3d2c20', 64, 0.3); 
        const leatherTex = createPixelTexture('#3b2314', '#1f1108', 64, 0.35); 
        const metalTex = createPixelTexture('#8c929a', '#4c5056', 64, 0.4); 
        const woodTex = createPixelTexture('#4d3319', '#2b1b0d', 64, 0.3); 
        const eyeTex = createPixelTexture('#ff2200', '#ffcc00', 32, 0.5); 

        // Materiais reutilizáveis
        const skinMat = new THREE.MeshStandardMaterial({ map: skinTex, roughness: 0.8, flatShading: true });
        const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.9, flatShading: true });
        const leatherMat = new THREE.MeshStandardMaterial({ map: leatherTex, roughness: 0.7, flatShading: true });
        const metalMat = new THREE.MeshStandardMaterial({ map: metalTex, roughness: 0.4, metalness: 0.8, flatShading: true });
        const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.9, flatShading: true });
        const eyeMat = new THREE.MeshBasicMaterial({ map: eyeTex });

        // --- CENA, CÂMERA & RENDERIZADOR ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0d0f12');
        scene.fog = new THREE.FogExp2('#0d0f12', 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 25;
        controls.target.set(0, 1.8, 0);

        // --- ILUMINAÇÃO AMBIENTAL E DE DESTAQUE ---
        const ambientLight = new THREE.AmbientLight('#2c3a28', 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight('#d3edd0', 1.2);
        dirLight.position.set(8, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Luz de tocha
        const torchLight = new THREE.PointLight('#ff7711', 1.8, 12);
        torchLight.position.set(-3, 3.5, 2);
        torchLight.castShadow = true;
        scene.add(torchLight);

        // --- CONSTRUÇÃO DA PLATAFORMA ---
        const pedestalGroup = new THREE.Group();

        const baseGeo = new THREE.CylinderGeometry(4.5, 5, 1, 12);
        const stoneTex = createPixelTexture('#2a2d32', '#15171a', 128, 0.4);
        const baseMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9, flatShading: true });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = -0.5;
        baseMesh.receiveShadow = true;
        pedestalGroup.add(baseMesh);

        const mossGeo = new THREE.CylinderGeometry(4.52, 4.52, 0.1, 12);
        const mossTex = createPixelTexture('#223d19', '#12240c', 64, 0.5);
        const mossMat = new THREE.MeshStandardMaterial({ map: mossTex, roughness: 0.95, flatShading: true });
        const mossMesh = new THREE.Mesh(mossGeo, mossMat);
        mossMesh.position.y = 0.01;
        mossMesh.receiveShadow = true;
        pedestalGroup.add(mossMesh);

        for (let i = 0; i < 7; i++) {
            const rockGeo = new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.25, 0);
            const rock = new THREE.Mesh(rockGeo, baseMat);
            const angle = Math.random() * Math.PI * 2;
            const dist = 1.8 + Math.random() * 2.2;
            rock.position.set(Math.cos(angle) * dist, 0.1, Math.sin(angle) * dist);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            rock.receiveShadow = true;
            pedestalGroup.add(rock);
        }

        const shroomCapMat = new THREE.MeshStandardMaterial({ color: '#33ffaa', emissive: '#11bb77', emissiveIntensity: 0.8, flatShading: true });
        const shroomStemMat = new THREE.MeshStandardMaterial({ color: '#ddddcc', flatShading: true });
        
        for (let i = 0; i < 5; i++) {
            const shroom = new THREE.Group();
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.25, 6), shroomStemMat);
            stem.position.y = 0.125;
            const cap = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.12, 8), shroomCapMat);
            cap.position.y = 0.25;
            shroom.add(stem, cap);

            const angle = (i / 5) * Math.PI * 2 + 0.3;
            shroom.position.set(Math.cos(angle) * 3.2, 0, Math.sin(angle) * 3.2);
            shroom.rotation.y = Math.random();
            shroom.scale.setScalar(0.8 + Math.random() * 0.5);
            pedestalGroup.add(shroom);
        }

        scene.add(pedestalGroup);

        // --- CONSTRUÇÃO DO PERSONAGEM: GOBLIN ---
        const goblin = new THREE.Group();

        const hips = new THREE.Group();
        hips.position.y = 1.6;
        goblin.add(hips);

        const pelvisGeo = new THREE.BoxGeometry(0.6, 0.35, 0.45);
        const pelvis = new THREE.Mesh(pelvisGeo, leatherMat);
        pelvis.castShadow = true;
        hips.add(pelvis);

        // Cinto com fivela
        const beltGeo = new THREE.BoxGeometry(0.65, 0.1, 0.48);
        const beltMesh = new THREE.Mesh(beltGeo, leatherMat);
        beltMesh.position.y = 0.12;
        hips.add(beltMesh);

        const buckleGeo = new THREE.BoxGeometry(0.15, 0.14, 0.52);
        const buckleMesh = new THREE.Mesh(buckleGeo, metalMat);
        buckleMesh.position.y = 0.12;
        hips.add(buckleMesh);

        const torso = new THREE.Group();
        torso.position.y = 0.15;
        hips.add(torso);

        const chestGeo = new THREE.BoxGeometry(0.75, 0.7, 0.55);
        const chest = new THREE.Mesh(chestGeo, skinMat);
        chest.position.y = 0.35;
        chest.castShadow = true;
        torso.add(chest);

        const vestGeo = new THREE.BoxGeometry(0.8, 0.6, 0.6);
        const vest = new THREE.Mesh(vestGeo, clothMat);
        vest.position.y = 0.38;
        vest.castShadow = true;
        torso.add(vest);

        // --- SISTEMA DE MALHA 3D REATIVA DAS VESTES (FÍSICA PROCEDURAL) ---
        const animatedCloth = [];

        function createPivotedStripGeo(width, height, depth) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            geo.translate(0, -height / 2, 0); // Define a origem no topo da tira (pivô limpo)
            return geo;
        }

        // 1. Saiote / Tanga Tfarroupada Reativa em Volta do Quadril (12 Tiras Articuladas)
        const loinclothGroup = new THREE.Group();
        loinclothGroup.position.set(0, -0.15, 0);
        hips.add(loinclothGroup);

        const stripCount = 12;
        for (let i = 0; i < stripCount; i++) {
            const angle = (i / stripCount) * Math.PI * 2;
            const radiusX = 0.35;
            const radiusZ = 0.28;
            const x = Math.sin(angle) * radiusX;
            const z = Math.cos(angle) * radiusZ;

            const stripWidth = 0.12 + Math.random() * 0.06;
            const stripHeight = 0.5 + Math.random() * 0.35;
            const stripMat = (i % 2 === 0) ? clothMat : leatherMat;

            const stripGeo = createPivotedStripGeo(stripWidth, stripHeight, 0.04);
            const stripMesh = new THREE.Mesh(stripGeo, stripMat);
            stripMesh.position.set(x, 0, z);

            const baseRx = 0.15 + Math.random() * 0.1;
            const baseRy = angle;
            const baseRz = (Math.random() - 0.5) * 0.1;
            stripMesh.rotation.set(baseRx, baseRy, baseRz);
            stripMesh.castShadow = true;
            stripMesh.receiveShadow = true;

            loinclothGroup.add(stripMesh);

            animatedCloth.push({
                mesh: stripMesh,
                baseRx: baseRx,
                baseRz: baseRz,
                baseRy: baseRy,
                offset: i * 0.35,
                reactY: z > 0 ? 0.6 : -0.4,
                reactDrag: z > 0 ? 1.4 : -1.2,
                reactRun: 0.8 + Math.random() * 0.4,
                reactAttack: z > 0 ? 0.8 : -0.5,
                reactHit: -0.8 - Math.random() * 0.4,
                reactTaunt: 0.6 + Math.random() * 0.4
            });
        }

        // 2. Capa / Manta Tfarroupada nas Costas e Ombros (7 Tiras de Pano)
        const capeGroup = new THREE.Group();
        capeGroup.position.set(0, 0.55, -0.28);
        torso.add(capeGroup);

        const capeStrips = 7;
        for (let i = 0; i < capeStrips; i++) {
            const span = (i / (capeStrips - 1) - 0.5) * 0.65;
            const stripWidth = 0.11 + Math.random() * 0.04;
            const stripHeight = 0.7 + Math.random() * 0.3;
            
            const stripGeo = createPivotedStripGeo(stripWidth, stripHeight, 0.03);
            const stripMesh = new THREE.Mesh(stripGeo, clothMat);
            stripMesh.position.set(span, 0, 0);

            const baseRx = -0.15 - Math.random() * 0.1;
            const baseRz = span * 0.2;
            stripMesh.rotation.set(baseRx, 0, baseRz);
            stripMesh.castShadow = true;
            stripMesh.receiveShadow = true;

            capeGroup.add(stripMesh);

            animatedCloth.push({
                mesh: stripMesh,
                baseRx: baseRx,
                baseRz: baseRz,
                baseRy: 0,
                offset: i * 0.4 + 1.5,
                reactY: -0.8,
                reactDrag: -2.0,
                reactRun: 0.9,
                reactAttack: -1.2,
                reactHit: 1.2,
                reactTaunt: -0.9
            });
        }

        // CABEÇA & DETALHES
        const neck = new THREE.Group();
        neck.position.set(0, 0.65, 0.15);
        torso.add(neck);

        const headGroup = new THREE.Group();
        headGroup.position.set(0, 0.1, 0.1);
        neck.add(headGroup);

        const headGeo = new THREE.BoxGeometry(0.7, 0.55, 0.6);
        const headMesh = new THREE.Mesh(headGeo, skinMat);
        headMesh.castShadow = true;
        headGroup.add(headMesh);

        const noseGeo = new THREE.ConeGeometry(0.12, 0.45, 4);
        const nose = new THREE.Mesh(noseGeo, skinMat);
        nose.position.set(0, -0.05, 0.45);
        nose.rotation.x = Math.PI / 2.2;
        nose.castShadow = true;
        headGroup.add(nose);

        const jawGeo = new THREE.BoxGeometry(0.5, 0.2, 0.45);
        const jaw = new THREE.Mesh(jawGeo, skinMat);
        jaw.position.set(0, -0.22, 0.12);
        jaw.castShadow = true;
        headGroup.add(jaw);

        const fangGeo = new THREE.ConeGeometry(0.04, 0.12, 4);
        const toothMat = new THREE.MeshStandardMaterial({ color: '#e6e1be', roughness: 0.5, flatShading: true });
        
        const fangLeft = new THREE.Mesh(fangGeo, toothMat);
        fangLeft.position.set(-0.15, -0.12, 0.32);
        fangLeft.rotation.x = -0.2;
        headGroup.add(fangLeft);

        const fangRight = new THREE.Mesh(fangGeo, toothMat);
        fangRight.position.set(0.15, -0.12, 0.32);
        fangRight.rotation.x = -0.2;
        headGroup.add(fangRight);

        const eyeGeo = new THREE.BoxGeometry(0.12, 0.09, 0.08);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.2, 0.08, 0.28);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.2, 0.08, 0.28);
        headGroup.add(leftEye, rightEye);

        const earGeo = new THREE.ConeGeometry(0.14, 0.75, 4);
        
        const leftEarGroup = new THREE.Group();
        leftEarGroup.position.set(-0.35, 0.05, -0.05);
        leftEarGroup.rotation.set(0.1, 0, Math.PI / 2.4);
        const leftEar = new THREE.Mesh(earGeo, skinMat);
        leftEar.position.y = 0.35;
        leftEar.castShadow = true;
        leftEarGroup.add(leftEar);
        headGroup.add(leftEarGroup);

        const rightEarGroup = new THREE.Group();
        rightEarGroup.position.set(0.35, 0.05, -0.05);
        rightEarGroup.rotation.set(0.1, 0, -Math.PI / 2.4);
        const rightEar = new THREE.Mesh(earGeo, skinMat);
        rightEar.position.y = 0.35;
        rightEar.castShadow = true;
        rightEarGroup.add(rightEar);
        headGroup.add(rightEarGroup);

        // BRAÇOS E TASSELS REATIVOS NOS PULSOS
        const leftShoulder = new THREE.Group();
        leftShoulder.position.set(-0.45, 0.5, 0);
        torso.add(leftShoulder);

        const armGeo = new THREE.CylinderGeometry(0.1, 0.08, 0.45, 6);
        const leftArm = new THREE.Mesh(armGeo, skinMat);
        leftArm.position.y = -0.2;
        leftArm.castShadow = true;
        leftShoulder.add(leftArm);

        const leftElbow = new THREE.Group();
        leftElbow.position.y = -0.4;
        leftShoulder.add(leftElbow);

        const forearmGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.45, 6);
        const leftForearm = new THREE.Mesh(forearmGeo, skinMat);
        leftForearm.position.y = -0.2;
        leftForearm.castShadow = true;
        leftElbow.add(leftForearm);

        const bracerGeo = new THREE.CylinderGeometry(0.11, 0.1, 0.25, 6);
        const bracerL = new THREE.Mesh(bracerGeo, leatherMat);
        bracerL.position.y = -0.18;
        leftForearm.add(bracerL);

        const rightShoulder = new THREE.Group();
        rightShoulder.position.set(0.45, 0.5, 0);
        torso.add(rightShoulder);

        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.position.y = -0.2;
        rightArm.castShadow = true;
        rightShoulder.add(rightArm);

        const rightElbow = new THREE.Group();
        rightElbow.position.y = -0.4;
        rightShoulder.add(rightElbow);

        const rightForearm = new THREE.Mesh(forearmGeo, skinMat);
        rightForearm.position.y = -0.2;
        rightForearm.castShadow = true;
        rightElbow.add(rightForearm);

        const bracerR = new THREE.Mesh(bracerGeo, leatherMat);
        bracerR.position.y = -0.18;
        rightForearm.add(bracerR);

        // 3. Tiras de Couro Penduradas nas Braçadeiras (Tassels Reativos)
        [
            { parent: leftForearm, side: -1 },
            { parent: rightForearm, side: 1 }
        ].forEach(arm => {
            for (let i = 0; i < 2; i++) {
                const strapGeo = createPivotedStripGeo(0.05, 0.3 + Math.random() * 0.15, 0.02);
                const strapMesh = new THREE.Mesh(strapGeo, leatherMat);
                strapMesh.position.set((i === 0 ? 0.08 : -0.08) * arm.side, -0.18, 0.05);
                strapMesh.castShadow = true;
                arm.parent.add(strapMesh);

                animatedCloth.push({
                    mesh: strapMesh,
                    baseRx: 0.1,
                    baseRz: 0,
                    baseRy: 0,
                    offset: i * 0.5 + arm.side,
                    reactY: 0.5,
                    reactDrag: 1.0,
                    reactRun: 1.2,
                    reactAttack: 1.5,
                    reactHit: -1.5,
                    reactTaunt: 1.0
                });
            }
        });

        const rightHand = new THREE.Group();
        rightHand.position.y = -0.42;
        rightElbow.add(rightHand);

        const daggerGroup = new THREE.Group();
        const hiltGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3, 6);
        const hilt = new THREE.Mesh(hiltGeo, woodMat);
        hilt.rotation.x = Math.PI / 2;
        daggerGroup.add(hilt);

        const guardGeo = new THREE.BoxGeometry(0.2, 0.05, 0.06);
        const guard = new THREE.Mesh(guardGeo, metalMat);
        guard.position.z = 0.12;
        daggerGroup.add(guard);

        const bladeGeo = new THREE.ConeGeometry(0.08, 0.7, 4);
        const blade = new THREE.Mesh(bladeGeo, metalMat);
        blade.position.z = 0.5;
        blade.rotation.x = Math.PI / 2;
        blade.scale.set(1, 1, 0.3);
        blade.castShadow = true;
        daggerGroup.add(blade);

        rightHand.add(daggerGroup);

        // PERNAS
        const leftHip = new THREE.Group();
        leftHip.position.set(-0.25, -0.1, 0);
        hips.add(leftHip);

        const legGeo = new THREE.CylinderGeometry(0.12, 0.09, 0.5, 6);
        const leftThigh = new THREE.Mesh(legGeo, skinMat);
        leftThigh.position.y = -0.22;
        leftThigh.castShadow = true;
        leftHip.add(leftThigh);

        const leftKnee = new THREE.Group();
        leftKnee.position.y = -0.45;
        leftHip.add(leftKnee);

        const leftShin = new THREE.Mesh(legGeo, skinMat);
        leftShin.position.y = -0.22;
        leftShin.castShadow = true;
        leftKnee.add(leftShin);

        const footGeo = new THREE.BoxGeometry(0.18, 0.1, 0.35);
        const leftFoot = new THREE.Mesh(footGeo, skinMat);
        leftFoot.position.set(0, -0.48, 0.08);
        leftFoot.castShadow = true;
        leftKnee.add(leftFoot);

        const rightHip = new THREE.Group();
        rightHip.position.set(0.25, -0.1, 0);
        hips.add(rightHip);

        const rightThigh = new THREE.Mesh(legGeo, skinMat);
        rightThigh.position.y = -0.22;
        rightThigh.castShadow = true;
        rightHip.add(rightThigh);

        const rightKnee = new THREE.Group();
        rightKnee.position.y = -0.45;
        rightHip.add(rightKnee);

        const rightShin = new THREE.Mesh(legGeo, skinMat);
        rightShin.position.y = -0.22;
        rightShin.castShadow = true;
        rightKnee.add(rightShin);

        const rightFoot = new THREE.Mesh(footGeo, skinMat);
        rightFoot.position.set(0, -0.48, 0.08);
        rightFoot.castShadow = true;
        rightKnee.add(rightFoot);

        scene.add(goblin);

        // --- PARTÍCULAS ---
        const particleCount = 45;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 8;
            particlePos[i + 1] = Math.random() * 5;
            particlePos[i + 2] = (Math.random() - 0.5) * 8;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

        const particleMat = new THREE.PointsMaterial({
            color: '#7ec850',
            size: 0.06,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- CONTROLES TECLADO E D-PAD ---
        const activeKeys = {};
        const virtualKeys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            audio.init();
            const key = e.key.toLowerCase();
            activeKeys[key] = true;
            activeKeys[e.code] = true;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key) || ['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) {
                e.preventDefault();
            }

            if (e.key === ' ' || e.code === 'Space') { triggerJump(); }
            if (key === 'j') { triggerAnimation('attack'); }
            if (key === 'k') { triggerAnimation('taunt'); }
            if (key === 'l') { triggerAnimation('hit'); }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            activeKeys[key] = false;
            activeKeys[e.code] = false;
        });

        window.addEventListener('pointerdown', () => window.focus());

        function setVirtualKey(dir, state) {
            audio.init();
            virtualKeys[dir] = state;
            const btn = document.getElementById(`btn-${dir}`);
            if (btn) {
                if (state) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        let currentAnim = 'idle';
        let animTime = 0;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -18;
        const baseHipsY = 1.6;

        const goblinPos = new THREE.Vector3(0, 0, 0);
        let rotationTarget = 0;

        function triggerAnimation(name) {
            audio.init();
            currentAnim = name;
            animTime = 0;

            if (name === 'attack') audio.playAttack();
            if (name === 'taunt') audio.playTaunt();
            if (name === 'hit') audio.playHit();
        }

        function triggerJump() {
            if (!isJumping) {
                audio.init();
                isJumping = true;
                jumpVelocity = 6.0;
                audio.playJump();
            }
        }

        // --- MÁQUINA DE ANIMAÇÃO PROCEDURAL + FÍSICA DAS VESTES ---
        function updateAnimations(delta) {
            animTime += delta;

            const moveUp = activeKeys['w'] || activeKeys['arrowup'] || activeKeys['KeyW'] || activeKeys['ArrowUp'] || virtualKeys.up;
            const moveDown = activeKeys['s'] || activeKeys['arrowdown'] || activeKeys['KeyS'] || activeKeys['ArrowDown'] || virtualKeys.down;
            const moveLeft = activeKeys['a'] || activeKeys['arrowleft'] || activeKeys['KeyA'] || activeKeys['ArrowLeft'] || virtualKeys.left;
            const moveRight = activeKeys['d'] || activeKeys['arrowright'] || activeKeys['KeyD'] || activeKeys['ArrowRight'] || virtualKeys.right;

            const isMovingInput = moveUp || moveDown || moveLeft || moveRight;

            if (isMovingInput && currentAnim !== 'attack' && currentAnim !== 'hit') {
                currentAnim = 'run';
            } else if (!isMovingInput && currentAnim === 'run') {
                currentAnim = 'idle';
            }

            const lerpSpeed = 10 * delta;

            // VETOR DE MOVIMENTO E DESLOCAMENTO
            let moveX = 0;
            let moveZ = 0;
            if (moveUp) moveZ -= 1;
            if (moveDown) moveZ += 1;
            if (moveLeft) moveX -= 1;
            if (moveRight) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
                rotationTarget = Math.atan2(moveVec.x, moveVec.z);
                
                const nextPos = goblinPos.clone().addScaledVector(moveVec, 3.2 * delta);
                if (nextPos.distanceTo(new THREE.Vector3(0, 0, 0)) < 3.8) {
                    goblinPos.copy(nextPos);
                }

                if (Math.sin(animTime * 14) > 0.8) {
                    audio.playStep();
                }
            }

            // Suavizar Rotação do Corpo
            let diff = rotationTarget - goblin.rotation.y;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            goblin.rotation.y += diff * lerpSpeed;
            goblin.position.x = goblinPos.x;
            goblin.position.z = goblinPos.z;

            // Seguir com Câmera
            controls.target.x = THREE.MathUtils.lerp(controls.target.x, goblin.position.x, 6 * delta);
            controls.target.z = THREE.MathUtils.lerp(controls.target.z, goblin.position.z, 6 * delta);

            // Física do Pulo
            if (isJumping) {
                goblin.position.y += jumpVelocity * delta;
                jumpVelocity += gravity * delta;
                if (goblin.position.y <= 0) {
                    goblin.position.y = 0;
                    isJumping = false;
                    audio.playStep();
                }
            }

            // --- ANIMAÇÃO DAS MALHAS DE TECIDO 3D REATIVAS ---
            const speedFactor = isMovingInput ? 1.0 : 0.0;
            const runBounce = Math.sin(animTime * 14) * 0.2 * speedFactor;
            const windDrag = isMovingInput ? 0.35 : 0.0;

            let verticalImpact = 0;
            if (isJumping) {
                verticalImpact = jumpVelocity * 0.05;
            }

            let attackImpact = 0;
            if (currentAnim === 'attack') {
                const strikeTime = animTime * 8;
                attackImpact = Math.sin(strikeTime) * 0.6;
            }

            let tauntImpact = 0;
            if (currentAnim === 'taunt') {
                tauntImpact = Math.sin(animTime * 12) * 0.4;
            }

            let hitImpact = 0;
            if (currentAnim === 'hit') {
                hitImpact = Math.sin(animTime * 15) * 0.7;
            }

            animatedCloth.forEach(cloth => {
                const wind = Math.sin(animTime * 4 + cloth.offset) * 0.06;
                let targetRx = cloth.baseRx + wind;
                let targetRz = cloth.baseRz + Math.cos(animTime * 3 + cloth.offset) * 0.03;

                targetRx += verticalImpact * cloth.reactY;
                targetRx += windDrag * cloth.reactDrag;
                targetRx += runBounce * cloth.reactRun;
                targetRx += attackImpact * cloth.reactAttack;
                targetRx += tauntImpact * cloth.reactTaunt;
                targetRx += hitImpact * cloth.reactHit;

                cloth.mesh.rotation.x += (targetRx - cloth.mesh.rotation.x) * 14 * delta;
                cloth.mesh.rotation.z += (targetRz - cloth.mesh.rotation.z) * 14 * delta;
            });

            // POSE IDLE
            if (currentAnim === 'idle') {
                const breath = Math.sin(animTime * 2.5) * 0.04;
                hips.position.y = THREE.MathUtils.lerp(hips.position.y, baseHipsY + breath, lerpSpeed);
                
                torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0.25 + breath * 0.5, lerpSpeed);
                headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, -0.15, lerpSpeed);
                headGroup.rotation.y = THREE.MathUtils.lerp(headGroup.rotation.y, Math.sin(animTime * 1.2) * 0.25, lerpSpeed);

                leftEarGroup.rotation.z = THREE.MathUtils.lerp(leftEarGroup.rotation.z, Math.PI / 2.4 + Math.sin(animTime * 3) * 0.08, lerpSpeed);
                rightEarGroup.rotation.z = THREE.MathUtils.lerp(rightEarGroup.rotation.z, -Math.PI / 2.4 - Math.sin(animTime * 3) * 0.08, lerpSpeed);

                leftShoulder.rotation.x = THREE.MathUtils.lerp(leftShoulder.rotation.x, 0.2, lerpSpeed);
                rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, -0.3, lerpSpeed);
                rightElbow.rotation.x = THREE.MathUtils.lerp(rightElbow.rotation.x, -0.8, lerpSpeed);

                leftHip.rotation.x = THREE.MathUtils.lerp(leftHip.rotation.x, -0.2, lerpSpeed);
                rightHip.rotation.x = THREE.MathUtils.lerp(rightHip.rotation.x, -0.2, lerpSpeed);
                leftKnee.rotation.x = THREE.MathUtils.lerp(leftKnee.rotation.x, 0.4, lerpSpeed);
                rightKnee.rotation.x = THREE.MathUtils.lerp(rightKnee.rotation.x, 0.4, lerpSpeed);
            }

            // POSE TROTE / CORRIDA
            else if (currentAnim === 'run') {
                const runFreq = 14;
                const bob = Math.abs(Math.sin(animTime * runFreq)) * 0.12;
                hips.position.y = THREE.MathUtils.lerp(hips.position.y, baseHipsY - 0.1 + bob, lerpSpeed);

                torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0.45, lerpSpeed);
                headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, -0.3, lerpSpeed);

                const legAngle = Math.sin(animTime * runFreq) * 0.75;
                leftHip.rotation.x = legAngle;
                rightHip.rotation.x = -legAngle;

                leftKnee.rotation.x = legAngle > 0 ? 0.8 : 0.2;
                rightKnee.rotation.x = legAngle < 0 ? 0.8 : 0.2;

                leftShoulder.rotation.x = -legAngle * 0.8;
                rightShoulder.rotation.x = legAngle * 0.8 - 0.2;
                rightElbow.rotation.x = -0.9;

                leftEarGroup.rotation.z = Math.PI / 2.4 + Math.sin(animTime * runFreq) * 0.15;
                rightEarGroup.rotation.z = -Math.PI / 2.4 - Math.sin(animTime * runFreq) * 0.15;
            }

            // POSE ATAQUE
            else if (currentAnim === 'attack') {
                const strikeTime = animTime * 8;
                if (strikeTime < Math.PI) {
                    rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, -1.2, lerpSpeed * 1.5);
                    rightShoulder.rotation.y = THREE.MathUtils.lerp(rightShoulder.rotation.y, 0.5, lerpSpeed * 1.5);
                    torso.rotation.y = THREE.MathUtils.lerp(torso.rotation.y, -0.4, lerpSpeed * 1.5);
                } else if (strikeTime < Math.PI * 2) {
                    rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, 1.2, lerpSpeed * 2.5);
                    rightShoulder.rotation.y = THREE.MathUtils.lerp(rightShoulder.rotation.y, -0.3, lerpSpeed * 2.5);
                    rightElbow.rotation.x = THREE.MathUtils.lerp(rightElbow.rotation.x, -0.1, lerpSpeed * 2.5);
                    torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0.5, lerpSpeed * 2.5);
                    torso.rotation.y = THREE.MathUtils.lerp(torso.rotation.y, 0.5, lerpSpeed * 2.5);
                } else {
                    currentAnim = 'idle';
                    rightShoulder.rotation.y = 0;
                    torso.rotation.y = 0;
                }
            }

            // POSE PROVOCAR
            else if (currentAnim === 'taunt') {
                const tauntCycle = Math.sin(animTime * 12);
                hips.position.y = baseHipsY + Math.abs(tauntCycle) * 0.15;
                torso.rotation.x = -0.2;
                headGroup.rotation.x = -0.4 + tauntCycle * 0.15;

                leftShoulder.rotation.x = -1.2 + tauntCycle * 0.3;
                rightShoulder.rotation.x = -1.2 - tauntCycle * 0.3;
                leftShoulder.rotation.z = -0.5;
                rightShoulder.rotation.z = 0.5;

                if (animTime > 1.8) {
                    leftShoulder.rotation.z = 0;
                    rightShoulder.rotation.z = 0;
                    currentAnim = 'idle';
                }
            }

            // POSE DANO
            else if (currentAnim === 'hit') {
                if (animTime < 0.4) {
                    torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, -0.5, lerpSpeed * 2);
                    headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, 0.4, lerpSpeed * 2);
                    hips.position.z = THREE.MathUtils.lerp(hips.position.z, -0.2, lerpSpeed * 2);
                    leftShoulder.rotation.z = -0.8;
                    rightShoulder.rotation.z = 0.8;
                } else {
                    hips.position.z = 0;
                    leftShoulder.rotation.z = 0;
                    rightShoulder.rotation.z = 0;
                    currentAnim = 'idle';
                }
            }
        }

        // --- LOOP PRINCIPAL ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            updateAnimations(delta);

            torchLight.intensity = 1.6 + Math.sin(clock.getElapsedTime() * 8) * 0.3 + Math.random() * 0.1;

            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += delta * 0.3;
                if (positions[i] > 5) positions[i] = 0;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
