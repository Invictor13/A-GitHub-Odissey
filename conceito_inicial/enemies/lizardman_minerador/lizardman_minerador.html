<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lizardman Minerador - A GitHub Odyssey</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #0d0b10; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #ui-overlay { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(20, 12, 10, 0.88); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(190, 75, 35, 0.4); 
            color: white; 
            padding: 16px 24px; 
            border-radius: 14px; 
            text-align: center; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8); 
            pointer-events: auto; 
            z-index: 10; 
            width: 92%;
            max-width: 680px;
        }

        h1 { margin: 0 0 4px 0; font-size: 19px; color: #ff6a33; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; text-shadow: 0 0 10px rgba(255, 106, 51, 0.4); }
        p.subtitle { margin: 0 0 12px 0; font-size: 13px; color: #d4a088; }
        
        .action-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
        .btn {
            background: #2a1510;
            border: 1px solid #7c351f;
            color: #f3c2b2;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover { background: #542215; color: #fff; border-color: #ff6a33; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(255,106,51,0.3); }
        .btn:active { transform: translateY(1px); }

        /* Controles Virtuais D-Pad */
        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 10px;
            gap: 15px;
        }

        .dpad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .dpad-row {
            display: flex;
            gap: 3px;
        }
        .dpad-btn {
            width: 32px;
            height: 32px;
            background: #2a1510;
            border: 1px solid #7c351f;
            color: #ff6a33;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #ff6a33;
            color: #0d0b10;
        }

        .controls-hint { 
            display: flex; 
            flex-direction: column;
            gap: 4px;
            font-size: 11px; 
            color: #9e7f72; 
            text-align: left;
        }
        .key { background: #331d16; color: #f2aa93; padding: 2px 6px; border-radius: 4px; border: 1px solid #5a281a; font-family: monospace; font-weight: bold; }

        #audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 12, 10, 0.85);
            border: 1px solid rgba(190, 75, 35, 0.4);
            color: #ff6a33;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
            font-size: 13px;
            backdrop-filter: blur(8px);
        }

        #badge-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 12, 10, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 8px 14px;
            border-radius: 8px;
            z-index: 10;
            font-size: 12px;
            backdrop-filter: blur(8px);
        }
        #badge-info strong { color: #ff6a33; }
    </style>

    <!-- Three.js e OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="badge-info">
        Inimigo: <strong>Lizardman Minerador</strong> | Malha 3D Reativa
    </div>

    <button id="audio-toggle">🔊 Áudio: ON</button>

    <div id="ui-overlay">
        <h1>Lizardman Minerador</h1>
        <p class="subtitle">A GitHub Odyssey — Galeria de Modelos 3D</p>
        
        <div class="action-bar">
            <button class="btn" onclick="triggerAnimation('idle')">Parado</button>
            <button class="btn" onclick="triggerAnimation('run')">Trote / Corrida</button>
            <button class="btn" onclick="triggerAnimation('attack')">Ataque de Picareta</button>
            <button class="btn" onclick="triggerAnimation('taunt')">Rugido / Provocar</button>
            <button class="btn" onclick="triggerAnimation('hit')">Receber Dano</button>
            <button class="btn" onclick="triggerJump()">Pular</button>
        </div>

        <div class="controls-wrapper">
            <div class="controls-hint">
                <span><span class="key">WASD</span> / <span class="key">Setas</span> Mover Lizardman</span>
                <span><span class="key">Espaço</span> Pular | <span class="key">J</span> Atacar</span>
                <span><span class="key">K</span> Rugir | <span class="key">L</span> Dano</span>
            </div>

            <!-- D-Pad Virtual de Movimentação -->
            <div class="dpad-container">
                <button class="dpad-btn" id="btn-up" onpointerdown="setVirtualKey('up', true)" onpointerup="setVirtualKey('up', false)" onpointerleave="setVirtualKey('up', false)">▲</button>
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-left" onpointerdown="setVirtualKey('left', true)" onpointerup="setVirtualKey('left', false)" onpointerleave="setVirtualKey('left', false)">◄</button>
                    <button class="dpad-btn" id="btn-down" onpointerdown="setVirtualKey('down', true)" onpointerup="setVirtualKey('down', false)" onpointerleave="setVirtualKey('down', false)">▼</button>
                    <button class="dpad-btn" id="btn-right" onpointerdown="setVirtualKey('right', true)" onpointerup="setVirtualKey('right', false)" onpointerleave="setVirtualKey('right', false)">►</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SINTETIZADOR DE ÁUDIO PROCEDURAL (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playStep() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160 + Math.random() * 50, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            playAttack() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                osc.frequency.linearRampToValueAtTime(250, this.ctx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            }

            playTaunt() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.35);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            playHit() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.14);
            }
        }

        const audio = new SoundFX();
        const audioBtn = document.getElementById('audio-toggle');
        audioBtn.addEventListener('click', () => {
            audio.init();
            audio.enabled = !audio.enabled;
            audioBtn.innerText = audio.enabled ? '🔊 Áudio: ON' : '🔇 Áudio: OFF';
        });

        // --- GERADORES DE TEXTURA PROCEDURAL ---
        function createPixelTexture(baseHex, detailHex, size = 64, noiseDensity = 0.25) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, size, size);

            const grid = 4;
            for (let x = 0; x < size; x += grid) {
                for (let y = 0; y < size; y += grid) {
                    if (Math.random() < noiseDensity) {
                        ctx.fillStyle = detailHex;
                        ctx.globalAlpha = 0.15 + Math.random() * 0.35;
                        ctx.fillRect(x, y, grid, grid);
                    }
                }
            }
            ctx.globalAlpha = 1.0;

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // Texturas específicas para Lizardman Dragônico
        const scaleTex = createPixelTexture('#9e3820', '#5e1b0c', 64, 0.45); 
        const bellyScaleTex = createPixelTexture('#d6905c', '#8a5026', 64, 0.35); 
        const clothTex = createPixelTexture('#42352b', '#241b15', 64, 0.3); 
        const leatherTex = createPixelTexture('#2d1a10', '#140904', 64, 0.35); 
        const metalTex = createPixelTexture('#737780', '#3b3d42', 64, 0.4); 
        const woodTex = createPixelTexture('#3b2513', '#1e1106', 64, 0.3); 
        const eyeTex = createPixelTexture('#ff9900', '#ffff00', 32, 0.5); 
        const crystalTex = createPixelTexture('#ff3300', '#ffaa00', 32, 0.6); 

        // Materiais reutilizáveis
        const scaleMat = new THREE.MeshStandardMaterial({ map: scaleTex, roughness: 0.75, flatShading: true });
        const bellyMat = new THREE.MeshStandardMaterial({ map: bellyScaleTex, roughness: 0.8, flatShading: true });
        const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.9, flatShading: true });
        const leatherMat = new THREE.MeshStandardMaterial({ map: leatherTex, roughness: 0.7, flatShading: true });
        const metalMat = new THREE.MeshStandardMaterial({ map: metalTex, roughness: 0.4, metalness: 0.8, flatShading: true });
        const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.9, flatShading: true });
        const eyeMat = new THREE.MeshBasicMaterial({ map: eyeTex });
        const crystalMat = new THREE.MeshStandardMaterial({ map: crystalTex, emissive: '#ff3300', emissiveIntensity: 0.8, flatShading: true });

        // --- CENA, CÂMERA & RENDERIZADOR ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0d0b10');
        scene.fog = new THREE.FogExp2('#0d0b10', 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 25;
        controls.target.set(0, 1.8, 0);

        // --- ILUMINAÇÃO VULCÂNICA AMBIENTAL ---
        const ambientLight = new THREE.AmbientLight('#3a241c', 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight('#ffcbb3', 1.2);
        dirLight.position.set(8, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Luz de magma vinda de baixo
        const magmaLight = new THREE.PointLight('#ff3300', 2.2, 14);
        magmaLight.position.set(0, -0.5, 2);
        scene.add(magmaLight);

        // --- CONSTRUÇÃO DA PLATAFORMA ---
        const pedestalGroup = new THREE.Group();

        const baseGeo = new THREE.CylinderGeometry(4.5, 5, 1, 12);
        const stoneTex = createPixelTexture('#211b19', '#120e0d', 128, 0.45);
        const baseMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9, flatShading: true });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = -0.5;
        baseMesh.receiveShadow = true;
        pedestalGroup.add(baseMesh);

        // Rachadura com Magma no chão
        const magmaCrackGeo = new THREE.CylinderGeometry(4.52, 4.52, 0.1, 12);
        const magmaTex = createPixelTexture('#381812', '#ff3300', 64, 0.35);
        const magmaMat = new THREE.MeshStandardMaterial({ map: magmaTex, roughness: 0.9, flatShading: true, emissive: '#aa2200', emissiveIntensity: 0.4 });
        const magmaMesh = new THREE.Mesh(magmaCrackGeo, magmaMat);
        magmaMesh.position.y = 0.01;
        magmaMesh.receiveShadow = true;
        pedestalGroup.add(magmaMesh);

        // Cristais de magma saindo das rochas
        for (let i = 0; i < 6; i++) {
            const crystalGeo = new THREE.OctahedronGeometry(0.18 + Math.random() * 0.2, 0);
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            const angle = (i / 6) * Math.PI * 2 + 0.2;
            const dist = 2.2 + Math.random() * 1.8;
            crystal.position.set(Math.cos(angle) * dist, 0.2, Math.sin(angle) * dist);
            crystal.rotation.set(Math.random() * 0.5, Math.random(), Math.random() * 0.5);
            crystal.scale.set(0.6, 1.8, 0.6);
            crystal.castShadow = true;
            pedestalGroup.add(crystal);
        }

        scene.add(pedestalGroup);

        // --- CONSTRUÇÃO DO PERSONAGEM: LIZARDMAN ---
        const lizardman = new THREE.Group();

        const hips = new THREE.Group();
        hips.position.y = 1.5;
        lizardman.add(hips);

        // Pélvis com escamas
        const pelvisGeo = new THREE.BoxGeometry(0.55, 0.32, 0.45);
        const pelvis = new THREE.Mesh(pelvisGeo, scaleMat);
        pelvis.castShadow = true;
        hips.add(pelvis);

        // Cinto com fivela de mineração
        const beltGeo = new THREE.BoxGeometry(0.6, 0.12, 0.48);
        const beltMesh = new THREE.Mesh(beltGeo, leatherMat);
        beltMesh.position.y = 0.1;
        hips.add(beltMesh);

        const buckleGeo = new THREE.BoxGeometry(0.14, 0.15, 0.52);
        const buckleMesh = new THREE.Mesh(buckleGeo, metalMat);
        buckleMesh.position.y = 0.1;
        hips.add(buckleMesh);

        // Lanterninha de mineração no cinto
        const minerLantern = new THREE.Group();
        minerLantern.position.set(-0.32, 0.0, 0.15);
        minerLantern.rotation.z = 0.1;
        hips.add(minerLantern);

        const lanternBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.12), metalMat);
        const lanternGlow = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.08), crystalMat);
        lanternBody.add(lanternGlow);
        minerLantern.add(lanternBody);

        // Torso / Tronco reptiliano magro e curvado
        const torso = new THREE.Group();
        torso.position.y = 0.15;
        hips.add(torso);

        const chestGeo = new THREE.BoxGeometry(0.68, 0.75, 0.5);
        const chest = new THREE.Mesh(chestGeo, scaleMat);
        chest.position.y = 0.35;
        chest.castShadow = true;
        torso.add(chest);

        // Placard/Barriga amarelada
        const bellyGeo = new THREE.BoxGeometry(0.5, 0.6, 0.08);
        const belly = new THREE.Mesh(bellyGeo, bellyMat);
        belly.position.set(0, 0.32, 0.22);
        torso.add(belly);

        // Colete de Couro de Minerador
        const vestGeo = new THREE.BoxGeometry(0.72, 0.55, 0.54);
        const vest = new THREE.Mesh(vestGeo, clothMat);
        vest.position.y = 0.38;
        vest.castShadow = true;
        torso.add(vest);

        // --- SISTEMA DE MALHA 3D REATIVA DAS VESTES & CAUDA (FÍSICA PROCEDURAL) ---
        const animatedCloth = [];

        function createPivotedStripGeo(width, height, depth) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            geo.translate(0, -height / 2, 0);
            return geo;
        }

        // 1. Saiote / Tanga Tfarroupada de Minerador
        const loinclothGroup = new THREE.Group();
        loinclothGroup.position.set(0, -0.12, 0);
        hips.add(loinclothGroup);

        const stripCount = 10;
        for (let i = 0; i < stripCount; i++) {
            const angle = (i / stripCount) * Math.PI * 2;
            const radiusX = 0.32;
            const radiusZ = 0.26;
            const x = Math.sin(angle) * radiusX;
            const z = Math.cos(angle) * radiusZ;

            const stripWidth = 0.11 + Math.random() * 0.05;
            const stripHeight = 0.45 + Math.random() * 0.3;
            const stripMat = (i % 2 === 0) ? clothMat : leatherMat;

            const stripGeo = createPivotedStripGeo(stripWidth, stripHeight, 0.04);
            const stripMesh = new THREE.Mesh(stripGeo, stripMat);
            stripMesh.position.set(x, 0, z);

            const baseRx = 0.15 + Math.random() * 0.1;
            const baseRy = angle;
            const baseRz = (Math.random() - 0.5) * 0.1;
            stripMesh.rotation.set(baseRx, baseRy, baseRz);
            stripMesh.castShadow = true;

            loinclothGroup.add(stripMesh);

            animatedCloth.push({
                mesh: stripMesh,
                baseRx: baseRx,
                baseRz: baseRz,
                baseRy: baseRy,
                offset: i * 0.35,
                reactY: z > 0 ? 0.6 : -0.4,
                reactDrag: z > 0 ? 1.4 : -1.2,
                reactRun: 0.8 + Math.random() * 0.4,
                reactAttack: z > 0 ? 0.8 : -0.5,
                reactHit: -0.8 - Math.random() * 0.4,
                reactTaunt: 0.6 + Math.random() * 0.4
            });
        }

        // 2. Capa de Ombro Taterada
        const capeGroup = new THREE.Group();
        capeGroup.position.set(0, 0.55, -0.26);
        torso.add(capeGroup);

        for (let i = 0; i < 5; i++) {
            const span = (i / 4 - 0.5) * 0.55;
            const stripWidth = 0.1 + Math.random() * 0.04;
            const stripHeight = 0.6 + Math.random() * 0.25;
            
            const stripGeo = createPivotedStripGeo(stripWidth, stripHeight, 0.03);
            const stripMesh = new THREE.Mesh(stripGeo, clothMat);
            stripMesh.position.set(span, 0, 0);

            const baseRx = -0.15 - Math.random() * 0.1;
            const baseRz = span * 0.2;
            stripMesh.rotation.set(baseRx, 0, baseRz);
            stripMesh.castShadow = true;

            capeGroup.add(stripMesh);

            animatedCloth.push({
                mesh: stripMesh,
                baseRx: baseRx,
                baseRz: baseRz,
                baseRy: 0,
                offset: i * 0.4 + 1.5,
                reactY: -0.8,
                reactDrag: -2.0,
                reactRun: 0.9,
                reactAttack: -1.2,
                reactHit: 1.2,
                reactTaunt: -0.9
            });
        }

        // 3. CAUDA ARTICULADA REPTILIANA
        const tailSegments = [];
        let parentJoint = hips;

        for (let i = 0; i < 5; i++) {
            const joint = new THREE.Group();
            if (i === 0) {
                joint.position.set(0, -0.15, -0.22);
                joint.rotation.x = -0.6;
            } else {
                joint.position.set(0, 0, -0.28);
            }

            const radiusTop = 0.14 - i * 0.022;
            const radiusBot = 0.11 - i * 0.022;
            const segGeo = new THREE.CylinderGeometry(radiusTop, radiusBot, 0.3, 6);
            segGeo.rotateX(Math.PI / 2);
            segGeo.translate(0, 0, -0.15);

            const segMesh = new THREE.Mesh(segGeo, scaleMat);
            segMesh.castShadow = true;
            joint.add(segMesh);

            const spineGeo = new THREE.ConeGeometry(0.04, 0.12, 4);
            const spine = new THREE.Mesh(spineGeo, scaleMat);
            spine.position.set(0, radiusTop + 0.04, -0.15);
            spine.rotation.x = -0.3;
            joint.add(spine);

            parentJoint.add(joint);
            parentJoint = joint;

            tailSegments.push({
                group: joint,
                baseRx: i === 0 ? -0.6 : 0.12,
                baseRy: 0,
                index: i
            });
        }

        // CABEÇA DRAGÔNICA / REPTILIANA DE LIZARDMAN
        const neck = new THREE.Group();
        neck.position.set(0, 0.65, 0.12);
        torso.add(neck);

        const headGroup = new THREE.Group();
        headGroup.position.set(0, 0.1, 0.1);
        neck.add(headGroup);

        const headGeo = new THREE.BoxGeometry(0.55, 0.45, 0.55);
        const headMesh = new THREE.Mesh(headGeo, scaleMat);
        headMesh.castShadow = true;
        headGroup.add(headMesh);

        const snoutGeo = new THREE.BoxGeometry(0.42, 0.28, 0.45);
        const snout = new THREE.Mesh(snoutGeo, scaleMat);
        snout.position.set(0, -0.05, 0.42);
        snout.castShadow = true;
        headGroup.add(snout);

        const nostrilGeo = new THREE.BoxGeometry(0.06, 0.05, 0.05);
        const nostrilL = new THREE.Mesh(nostrilGeo, leatherMat);
        nostrilL.position.set(-0.12, 0.06, 0.62);
        const nostrilR = new THREE.Mesh(nostrilGeo, leatherMat);
        nostrilR.position.set(0.12, 0.06, 0.62);
        headGroup.add(nostrilL, nostrilR);

        const jawGeo = new THREE.BoxGeometry(0.38, 0.15, 0.4);
        const jaw = new THREE.Mesh(jawGeo, scaleMat);
        jaw.position.set(0, -0.22, 0.38);
        jaw.castShadow = true;
        headGroup.add(jaw);

        const fangGeo = new THREE.ConeGeometry(0.035, 0.1, 4);
        const toothMat = new THREE.MeshStandardMaterial({ color: '#f0e3b6', roughness: 0.4, flatShading: true });
        
        const fangL1 = new THREE.Mesh(fangGeo, toothMat);
        fangL1.position.set(-0.15, -0.16, 0.58);
        fangL1.rotation.x = Math.PI;
        const fangR1 = new THREE.Mesh(fangGeo, toothMat);
        fangR1.position.set(0.15, -0.16, 0.58);
        fangR1.rotation.x = Math.PI;
        headGroup.add(fangL1, fangR1);

        const eyeGeo = new THREE.BoxGeometry(0.1, 0.12, 0.06);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.24, 0.1, 0.22);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.24, 0.1, 0.22);
        headGroup.add(leftEye, rightEye);

        // Chifres Dragônicos curvados para trás (Grupos articuláveis)
        const hornGeo = new THREE.ConeGeometry(0.08, 0.6, 5);
        const hornMat = new THREE.MeshStandardMaterial({ color: '#2b1b15', roughness: 0.6, flatShading: true });

        const leftHornGroup = new THREE.Group();
        leftHornGroup.position.set(-0.2, 0.3, -0.18);
        const leftHorn = new THREE.Mesh(hornGeo, hornMat);
        leftHorn.rotation.set(-0.8, -0.2, -0.3);
        leftHorn.castShadow = true;
        leftHornGroup.add(leftHorn);

        const rightHornGroup = new THREE.Group();
        rightHornGroup.position.set(0.2, 0.3, -0.18);
        const rightHorn = new THREE.Mesh(hornGeo, hornMat);
        rightHorn.rotation.set(-0.8, 0.2, 0.3);
        rightHorn.castShadow = true;
        rightHornGroup.add(rightHorn);

        headGroup.add(leftHornGroup, rightHornGroup);

        // BRAÇOS E TASSELS REATIVOS
        const leftShoulder = new THREE.Group();
        leftShoulder.position.set(-0.42, 0.5, 0);
        torso.add(leftShoulder);

        const armGeo = new THREE.CylinderGeometry(0.09, 0.07, 0.45, 6);
        const leftArm = new THREE.Mesh(armGeo, scaleMat);
        leftArm.position.y = -0.2;
        leftArm.castShadow = true;
        leftShoulder.add(leftArm);

        const leftElbow = new THREE.Group();
        leftElbow.position.y = -0.4;
        leftShoulder.add(leftElbow);

        const forearmGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.45, 6);
        const leftForearm = new THREE.Mesh(forearmGeo, scaleMat);
        leftForearm.position.y = -0.2;
        leftForearm.castShadow = true;
        leftElbow.add(leftForearm);

        const bracerGeo = new THREE.CylinderGeometry(0.1, 0.09, 0.22, 6);
        const bracerL = new THREE.Mesh(bracerGeo, leatherMat);
        bracerL.position.y = -0.18;
        leftForearm.add(bracerL);

        const rightShoulder = new THREE.Group();
        rightShoulder.position.set(0.42, 0.5, 0);
        torso.add(rightShoulder);

        const rightArm = new THREE.Mesh(armGeo, scaleMat);
        rightArm.position.y = -0.2;
        rightArm.castShadow = true;
        rightShoulder.add(rightArm);

        const rightElbow = new THREE.Group();
        rightElbow.position.y = -0.4;
        rightShoulder.add(rightElbow);

        const rightForearm = new THREE.Mesh(forearmGeo, scaleMat);
        rightForearm.position.y = -0.2;
        rightForearm.castShadow = true;
        rightElbow.add(rightForearm);

        const bracerR = new THREE.Mesh(bracerGeo, leatherMat);
        bracerR.position.y = -0.18;
        rightForearm.add(bracerR);

        [
            { parent: leftForearm, side: -1 },
            { parent: rightForearm, side: 1 }
        ].forEach(arm => {
            for (let i = 0; i < 2; i++) {
                const strapGeo = createPivotedStripGeo(0.04, 0.28 + Math.random() * 0.12, 0.02);
                const strapMesh = new THREE.Mesh(strapGeo, leatherMat);
                strapMesh.position.set((i === 0 ? 0.07 : -0.07) * arm.side, -0.18, 0.04);
                strapMesh.castShadow = true;
                arm.parent.add(strapMesh);

                animatedCloth.push({
                    mesh: strapMesh,
                    baseRx: 0.1,
                    baseRz: 0,
                    baseRy: 0,
                    offset: i * 0.5 + arm.side,
                    reactY: 0.5,
                    reactDrag: 1.0,
                    reactRun: 1.2,
                    reactAttack: 1.5,
                    reactHit: -1.5,
                    reactTaunt: 1.0
                });
            }
        });

        const rightHand = new THREE.Group();
        rightHand.position.y = -0.42;
        rightElbow.add(rightHand);

        // ARMA: PICARETA DE MINERAÇÃO LIZARDMAN
        const pickaxeGroup = new THREE.Group();
        
        const hiltGeo = new THREE.CylinderGeometry(0.035, 0.035, 1.2, 6);
        const hilt = new THREE.Mesh(hiltGeo, woodMat);
        hilt.rotation.x = Math.PI / 2;
        pickaxeGroup.add(hilt);

        const pickHeadGeo = new THREE.BoxGeometry(0.12, 0.18, 0.18);
        const pickHead = new THREE.Mesh(pickHeadGeo, metalMat);
        pickHead.position.z = 0.45;
        pickaxeGroup.add(pickHead);

        const pickSpikeGeo = new THREE.ConeGeometry(0.07, 0.65, 4);
        const pickSpikeFront = new THREE.Mesh(pickSpikeGeo, metalMat);
        pickSpikeFront.position.set(0, 0.3, 0.45);
        pickSpikeFront.rotation.set(-0.2, 0, 0);
        pickSpikeFront.scale.set(1, 1, 0.4);
        pickSpikeFront.castShadow = true;
        pickaxeGroup.add(pickSpikeFront);

        const pickSpikeBack = new THREE.Mesh(pickSpikeGeo, metalMat);
        pickSpikeBack.position.set(0, -0.25, 0.45);
        pickSpikeBack.rotation.set(Math.PI + 0.3, 0, 0);
        pickSpikeBack.scale.set(0.8, 0.7, 0.4);
        pickSpikeBack.castShadow = true;
        pickaxeGroup.add(pickSpikeBack);

        rightHand.add(pickaxeGroup);

        // PERNAS & PÉS COM GARRAS
        const leftHip = new THREE.Group();
        leftHip.position.set(-0.22, -0.1, 0);
        hips.add(leftHip);

        const legGeo = new THREE.CylinderGeometry(0.11, 0.08, 0.5, 6);
        const leftThigh = new THREE.Mesh(legGeo, scaleMat);
        leftThigh.position.y = -0.22;
        leftThigh.castShadow = true;
        leftHip.add(leftThigh);

        const leftKnee = new THREE.Group();
        leftKnee.position.y = -0.45;
        leftHip.add(leftKnee);

        const leftShin = new THREE.Mesh(legGeo, scaleMat);
        leftShin.position.y = -0.22;
        leftShin.castShadow = true;
        leftKnee.add(leftShin);

        const footGeo = new THREE.BoxGeometry(0.16, 0.09, 0.38);
        const leftFoot = new THREE.Mesh(footGeo, scaleMat);
        leftFoot.position.set(0, -0.48, 0.1);
        leftFoot.castShadow = true;
        leftKnee.add(leftFoot);

        const clawGeo = new THREE.ConeGeometry(0.03, 0.1, 4);
        for (let i = -1; i <= 1; i++) {
            const claw = new THREE.Mesh(clawGeo, hornMat);
            claw.position.set(i * 0.05, -0.48, 0.3);
            claw.rotation.x = Math.PI / 2;
            leftKnee.add(claw);
        }

        const rightHip = new THREE.Group();
        rightHip.position.set(0.22, -0.1, 0);
        hips.add(rightHip);

        const rightThigh = new THREE.Mesh(legGeo, scaleMat);
        rightThigh.position.y = -0.22;
        rightThigh.castShadow = true;
        rightHip.add(rightThigh);

        const rightKnee = new THREE.Group();
        rightKnee.position.y = -0.45;
        rightHip.add(rightKnee);

        const rightShin = new THREE.Mesh(legGeo, scaleMat);
        rightShin.position.y = -0.22;
        rightShin.castShadow = true;
        rightKnee.add(rightShin);

        const rightFoot = new THREE.Mesh(footGeo, scaleMat);
        rightFoot.position.set(0, -0.48, 0.1);
        rightFoot.castShadow = true;
        rightKnee.add(rightFoot);

        for (let i = -1; i <= 1; i++) {
            const claw = new THREE.Mesh(clawGeo, hornMat);
            claw.position.set(i * 0.05, -0.48, 0.3);
            claw.rotation.x = Math.PI / 2;
            rightKnee.add(claw);
        }

        scene.add(lizardman);

        // --- PARTÍCULAS ---
        const particleCount = 50;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 8;
            particlePos[i + 1] = Math.random() * 5;
            particlePos[i + 2] = (Math.random() - 0.5) * 8;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

        const particleMat = new THREE.PointsMaterial({
            color: '#ff5500',
            size: 0.07,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- CONTROLES TECLADO E D-PAD ---
        const activeKeys = {};
        const virtualKeys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            audio.init();
            const key = e.key.toLowerCase();
            activeKeys[key] = true;
            activeKeys[e.code] = true;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key) || ['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) {
                e.preventDefault();
            }

            if (e.key === ' ' || e.code === 'Space') { triggerJump(); }
            if (key === 'j') { triggerAnimation('attack'); }
            if (key === 'k') { triggerAnimation('taunt'); }
            if (key === 'l') { triggerAnimation('hit'); }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            activeKeys[key] = false;
            activeKeys[e.code] = false;
        });

        window.addEventListener('pointerdown', () => window.focus());

        function setVirtualKey(dir, state) {
            audio.init();
            virtualKeys[dir] = state;
            const btn = document.getElementById(`btn-${dir}`);
            if (btn) {
                if (state) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        let currentAnim = 'idle';
        let animTime = 0;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -18;
        const baseHipsY = 1.5;

        const lizardmanPos = new THREE.Vector3(0, 0, 0);
        let rotationTarget = 0;

        function triggerAnimation(name) {
            audio.init();
            currentAnim = name;
            animTime = 0;

            if (name === 'attack') audio.playAttack();
            if (name === 'taunt') audio.playTaunt();
            if (name === 'hit') audio.playHit();
        }

        function triggerJump() {
            if (!isJumping) {
                audio.init();
                isJumping = true;
                jumpVelocity = 6.0;
                audio.playJump();
            }
        }

        // --- MÁQUINA DE ANIMAÇÃO PROCEDURAL ---
        function updateAnimations(delta) {
            animTime += delta;

            const moveUp = activeKeys['w'] || activeKeys['arrowup'] || activeKeys['KeyW'] || activeKeys['ArrowUp'] || virtualKeys.up;
            const moveDown = activeKeys['s'] || activeKeys['arrowdown'] || activeKeys['KeyS'] || activeKeys['ArrowDown'] || virtualKeys.down;
            const moveLeft = activeKeys['a'] || activeKeys['arrowleft'] || activeKeys['KeyA'] || activeKeys['ArrowLeft'] || virtualKeys.left;
            const moveRight = activeKeys['d'] || activeKeys['arrowright'] || activeKeys['KeyD'] || activeKeys['ArrowRight'] || virtualKeys.right;

            const isMovingInput = moveUp || moveDown || moveLeft || moveRight;

            if (isMovingInput && currentAnim !== 'attack' && currentAnim !== 'hit') {
                currentAnim = 'run';
            } else if (!isMovingInput && currentAnim === 'run') {
                currentAnim = 'idle';
            }

            const lerpSpeed = 10 * delta;

            // VETOR DE MOVIMENTO
            let moveX = 0;
            let moveZ = 0;
            if (moveUp) moveZ -= 1;
            if (moveDown) moveZ += 1;
            if (moveLeft) moveX -= 1;
            if (moveRight) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
                rotationTarget = Math.atan2(moveVec.x, moveVec.z);
                
                const nextPos = lizardmanPos.clone().addScaledVector(moveVec, 3.4 * delta);
                if (nextPos.distanceTo(new THREE.Vector3(0, 0, 0)) < 3.8) {
                    lizardmanPos.copy(nextPos);
                }

                if (Math.sin(animTime * 15) > 0.8) {
                    audio.playStep();
                }
            }

            // Suavizar Rotação do Corpo
            let diff = rotationTarget - lizardman.rotation.y;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            lizardman.rotation.y += diff * lerpSpeed;
            lizardman.position.x = lizardmanPos.x;
            lizardman.position.z = lizardmanPos.z;

            // Câmera
            controls.target.x = THREE.MathUtils.lerp(controls.target.x, lizardman.position.x, 6 * delta);
            controls.target.z = THREE.MathUtils.lerp(controls.target.z, lizardman.position.z, 6 * delta);

            // Física do Pulo
            if (isJumping) {
                lizardman.position.y += jumpVelocity * delta;
                jumpVelocity += gravity * delta;
                if (lizardman.position.y <= 0) {
                    lizardman.position.y = 0;
                    isJumping = false;
                    audio.playStep();
                }
            }

            // --- FÍSICA PROCEDURAL DAS MALHAS 3D REATIVAS ---
            const speedFactor = isMovingInput ? 1.0 : 0.0;
            const runBounce = Math.sin(animTime * 15) * 0.22 * speedFactor;
            const windDrag = isMovingInput ? 0.38 : 0.0;

            let verticalImpact = 0;
            if (isJumping) verticalImpact = jumpVelocity * 0.05;

            let attackImpact = 0;
            if (currentAnim === 'attack') attackImpact = Math.sin(animTime * 8) * 0.6;

            let tauntImpact = 0;
            if (currentAnim === 'taunt') tauntImpact = Math.sin(animTime * 12) * 0.4;

            let hitImpact = 0;
            if (currentAnim === 'hit') hitImpact = Math.sin(animTime * 15) * 0.7;

            // Atualizar Tecidos
            animatedCloth.forEach(cloth => {
                const wind = Math.sin(animTime * 4 + cloth.offset) * 0.06;
                let targetRx = cloth.baseRx + wind;
                let targetRz = cloth.baseRz + Math.cos(animTime * 3 + cloth.offset) * 0.03;

                targetRx += verticalImpact * cloth.reactY;
                targetRx += windDrag * cloth.reactDrag;
                targetRx += runBounce * cloth.reactRun;
                targetRx += attackImpact * cloth.reactAttack;
                targetRx += tauntImpact * cloth.reactTaunt;
                targetRx += hitImpact * cloth.reactHit;

                cloth.mesh.rotation.x += (targetRx - cloth.mesh.rotation.x) * 14 * delta;
                cloth.mesh.rotation.z += (targetRz - cloth.mesh.rotation.z) * 14 * delta;
            });

            // Atualizar Física da Cauda Articulada
            tailSegments.forEach((seg, idx) => {
                const waveFreq = 8;
                const waveDelay = idx * 0.25;
                const tailWaveY = Math.sin(animTime * waveFreq - waveDelay) * (0.15 + idx * 0.05);
                const tailWaveX = Math.cos(animTime * (waveFreq * 0.5) - waveDelay) * 0.08;

                let targetRy = seg.baseRy + tailWaveY;
                let targetRx = seg.baseRx + tailWaveX;

                if (isMovingInput) {
                    targetRy += Math.sin(animTime * 15 - waveDelay) * 0.35;
                }
                if (currentAnim === 'attack') {
                    targetRy += Math.sin(animTime * 10 - waveDelay) * 0.5;
                }
                if (currentAnim === 'taunt') {
                    targetRx -= 0.15 * idx;
                }

                seg.group.rotation.y = THREE.MathUtils.lerp(seg.group.rotation.y, targetRy, 12 * delta);
                seg.group.rotation.x = THREE.MathUtils.lerp(seg.group.rotation.x, targetRx, 12 * delta);
            });

            // POSE IDLE
            if (currentAnim === 'idle') {
                const breath = Math.sin(animTime * 2.8) * 0.04;
                hips.position.y = THREE.MathUtils.lerp(hips.position.y, baseHipsY + breath, lerpSpeed);
                
                torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0.3 + breath * 0.5, lerpSpeed);
                headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, -0.2, lerpSpeed);
                headGroup.rotation.y = THREE.MathUtils.lerp(headGroup.rotation.y, Math.sin(animTime * 1.4) * 0.2, lerpSpeed);

                leftHornGroup.rotation.z = THREE.MathUtils.lerp(leftHornGroup.rotation.z, Math.sin(animTime * 3) * 0.05, lerpSpeed);
                rightHornGroup.rotation.z = THREE.MathUtils.lerp(rightHornGroup.rotation.z, -Math.sin(animTime * 3) * 0.05, lerpSpeed);

                leftShoulder.rotation.x = THREE.MathUtils.lerp(leftShoulder.rotation.x, 0.3, lerpSpeed);
                rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, -0.4, lerpSpeed);
                rightElbow.rotation.x = THREE.MathUtils.lerp(rightElbow.rotation.x, -0.7, lerpSpeed);

                leftHip.rotation.x = THREE.MathUtils.lerp(leftHip.rotation.x, -0.25, lerpSpeed);
                rightHip.rotation.x = THREE.MathUtils.lerp(rightHip.rotation.x, -0.25, lerpSpeed);
                leftKnee.rotation.x = THREE.MathUtils.lerp(leftKnee.rotation.x, 0.45, lerpSpeed);
                rightKnee.rotation.x = THREE.MathUtils.lerp(rightKnee.rotation.x, 0.45, lerpSpeed);
            }

            // POSE TROTE / CORRIDA
            else if (currentAnim === 'run') {
                const runFreq = 15;
                const bob = Math.abs(Math.sin(animTime * runFreq)) * 0.13;
                hips.position.y = THREE.MathUtils.lerp(hips.position.y, baseHipsY - 0.08 + bob, lerpSpeed);

                torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0.5, lerpSpeed);
                headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, -0.35, lerpSpeed);

                const legAngle = Math.sin(animTime * runFreq) * 0.8;
                leftHip.rotation.x = legAngle;
                rightHip.rotation.x = -legAngle;

                leftKnee.rotation.x = legAngle > 0 ? 0.85 : 0.25;
                rightKnee.rotation.x = legAngle < 0 ? 0.85 : 0.25;

                leftShoulder.rotation.x = -legAngle * 0.85;
                rightShoulder.rotation.x = legAngle * 0.85 - 0.2;
                rightElbow.rotation.x = -0.95;
            }

            // POSE ATAQUE DE PICARETA
            else if (currentAnim === 'attack') {
                const strikeTime = animTime * 8;
                if (strikeTime < Math.PI) {
                    rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, -1.8, lerpSpeed * 1.8);
                    rightElbow.rotation.x = THREE.MathUtils.lerp(rightElbow.rotation.x, -0.4, lerpSpeed * 1.8);
                    torso.rotation.y = THREE.MathUtils.lerp(torso.rotation.y, -0.5, lerpSpeed * 1.8);
                } else if (strikeTime < Math.PI * 2) {
                    rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, 1.4, lerpSpeed * 3.0);
                    rightElbow.rotation.x = THREE.MathUtils.lerp(rightElbow.rotation.x, -0.2, lerpSpeed * 3.0);
                    torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0.6, lerpSpeed * 3.0);
                    torso.rotation.y = THREE.MathUtils.lerp(torso.rotation.y, 0.6, lerpSpeed * 3.0);
                } else {
                    currentAnim = 'idle';
                    rightShoulder.rotation.y = 0;
                    torso.rotation.y = 0;
                }
            }

            // POSE PROVOCAR / RUGIDO
            else if (currentAnim === 'taunt') {
                const tauntCycle = Math.sin(animTime * 12);
                hips.position.y = baseHipsY + Math.abs(tauntCycle) * 0.16;
                torso.rotation.x = -0.3;
                headGroup.rotation.x = -0.5 + tauntCycle * 0.2;

                leftShoulder.rotation.x = -1.4 + tauntCycle * 0.3;
                rightShoulder.rotation.x = -1.4 - tauntCycle * 0.3;
                leftShoulder.rotation.z = -0.6;
                rightShoulder.rotation.z = 0.6;

                if (animTime > 1.8) {
                    leftShoulder.rotation.z = 0;
                    rightShoulder.rotation.z = 0;
                    currentAnim = 'idle';
                }
            }

            // POSE DANO
            else if (currentAnim === 'hit') {
                if (animTime < 0.4) {
                    torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, -0.55, lerpSpeed * 2);
                    headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, 0.45, lerpSpeed * 2);
                    hips.position.z = THREE.MathUtils.lerp(hips.position.z, -0.25, lerpSpeed * 2);
                    leftShoulder.rotation.z = -0.85;
                    rightShoulder.rotation.z = 0.85;
                } else {
                    hips.position.z = 0;
                    leftShoulder.rotation.z = 0;
                    rightShoulder.rotation.z = 0;
                    currentAnim = 'idle';
                }
            }
        }

        // --- LOOP PRINCIPAL ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            updateAnimations(delta);

            magmaLight.intensity = 2.0 + Math.sin(clock.getElapsedTime() * 7) * 0.4 + Math.random() * 0.15;

            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += delta * 0.35;
                if (positions[i] > 5) positions[i] = 0;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
