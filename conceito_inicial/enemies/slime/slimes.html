<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slime Terrarium - A GitHub Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a24; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        #add-slime-btn {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: #44ff44; 
            color: #1a1a24;
            border: none; 
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #add-slime-btn:hover { background-color: #22cc22; }
        #add-slime-btn:active { transform: translateX(-50%) scale(0.95); }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <button id="add-slime-btn">Adicionar Slime</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. GERADOR DE TEXTURAS PROCEDURAIS ---
        function createBumpTexture(type, size = 512) {
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d'); const imgData = ctx.createImageData(size, size);
            for (let i = 0; i < imgData.data.length; i += 4) {
                let val = 128;
                if (type === 'grass') { val += (Math.sin((i / 4) % size) * 20) + (Math.cos(Math.floor((i / 4) / size)) * 20) + (Math.random() * 40 - 20); }
                imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = val; imgData.data[i+3] = 255; 
            }
            ctx.putImageData(imgData, 0, 0); const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        const texGrassBump = createBumpTexture('grass', 512);

        function createSplatTexture(size = 128) {
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(size/2, size/2, size/3.5, 0, Math.PI*2); ctx.fill();
            
            for(let i=0; i<8; i++) {
                ctx.beginPath();
                const r = size/8 + Math.random()*(size/8);
                const x = size/2 + (Math.random()-0.5)*(size/1.5);
                const y = size/2 + (Math.random()-0.5)*(size/1.5);
                ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }
        const texSplat = createSplatTexture();

        // --- 2. CENA E CÂMERA ---
        const scene = new THREE.Scene(); 
        scene.background = new THREE.Color('#87CEEB'); 
        scene.fog = new THREE.FogExp2('#87CEEB', 0.015);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); 
        camera.position.set(0, 20, 40);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); 
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true; controls.dampingFactor = 0.05; 
        controls.target.set(0, 2, 0); 
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 10; controls.maxDistance = 80;

        // --- 3. ILUMINAÇÃO ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.8); 
        hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5); 
        dirLight.position.set(20, 30, 20); 
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        const d = 35; dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d; 
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d; 
        scene.add(dirLight);

        // --- 4. AMBIENTE ---
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x2e5c23, roughness: 1.0, bumpMap: texGrassBump, bumpScale: 0.15 
        });
        const ground = new THREE.Mesh(new THREE.CylinderGeometry(40, 35, 2, 64), groundMat); 
        ground.position.y = -1; ground.receiveShadow = true; scene.add(ground);
        
        const rockGeo = new THREE.DodecahedronGeometry(1.5, 1);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9, flatShading: true });
        for(let i=0; i<25; i++) {
            const rock = new THREE.Mesh(rockGeo, rockMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 10 + Math.random() * 28;
            rock.position.set(Math.cos(angle)*radius, -0.5, Math.sin(angle)*radius);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.scale.set(0.5 + Math.random()*2, 0.5 + Math.random()*1.5, 0.5 + Math.random()*2);
            rock.castShadow = true; rock.receiveShadow = true;
            scene.add(rock);
        }

        // --- 5. VFX E RASTROS ---
        const particles = [];
        const particleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        
        function spawnVFX(pos, count, color) {
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            for(let i = 0; i < count; i++) {
                const p = new THREE.Mesh(particleGeo, mat); p.position.copy(pos);
                p.position.x += (Math.random() - 0.5) * 2.0; p.position.y += (Math.random() - 0.5) * 2.0; p.position.z += (Math.random() - 0.5) * 2.0;
                const speed = 15;
                p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*speed, (Math.random()*speed), (Math.random()-0.5)*speed), life: 1.0 };
                scene.add(p); particles.push(p);
            }
        }

        const slimeTrails = [];
        const trailGeo = new THREE.PlaneGeometry(1, 1);
        function spawnTrail(x, z, color, size) {
            const mat = new THREE.MeshBasicMaterial({ 
                color: color, 
                transparent: true, 
                opacity: 0.75, 
                depthWrite: false,
                alphaMap: texSplat 
            });
            const mesh = new THREE.Mesh(trailGeo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x, 0.02 + Math.random() * 0.01, z);
            mesh.scale.setScalar(size);
            scene.add(mesh);
            slimeTrails.push({ mesh: mesh, life: 1.0, maxSize: size });
        }

        // --- 6. SLIMES ---
        const slimes = [];
        const slimeColors = [0x44ff44, 0x44aaff, 0xff4444, 0x9944ff, 0xffaa00, 0xff44aa]; 
        
        const matEyeBase = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, emissive: 0xffffff, emissiveIntensity: 0.3 });
        const matEyePupil = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        const matFlashWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });

        class Slime {
            constructor(x, z) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                
                this.color = slimeColors[Math.floor(Math.random() * slimeColors.length)];
                this.baseScale = 1.5 + Math.random() * 1.5; 
                
                this.baseMat = new THREE.MeshPhysicalMaterial({
                    color: this.color,
                    transmission: 0.95, 
                    opacity: 1,
                    transparent: true,
                    roughness: 0.05, 
                    ior: 1.2, 
                    thickness: 2.5,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1,
                    flatShading: false
                });

                const bodyGeo = new THREE.SphereGeometry(1.0, 32, 32);
                this.body = new THREE.Mesh(bodyGeo, this.baseMat);
                this.body.position.y = 1.0;
                this.body.castShadow = true;
                this.group.add(this.body);

                const coreMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.4, emissive: this.color, emissiveIntensity: 0.3 });
                const coreGeo = new THREE.SphereGeometry(0.35, 16, 16); 
                this.core = new THREE.Mesh(coreGeo, coreMat);
                this.core.position.y = 1.0;
                this.group.add(this.core);
                
                this.bubbles = [];
                for(let i=0; i<8; i++) {
                    const bubble = new THREE.Mesh(new THREE.SphereGeometry(0.08 + Math.random()*0.08, 8, 8), coreMat);
                    bubble.position.set((Math.random()-0.5)*0.8, 1.0 + (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8);
                    this.group.add(bubble);
                    this.bubbles.push({ mesh: bubble, speed: Math.random()*2+1, angle: Math.random()*Math.PI*2, dist: 0.2 + Math.random()*0.5 });
                }

                // OLHOS FURIOSOS CORRIGIDOS (Sobrancelhas franzidas em formato de "V" bravo)
                this.eyeL = new THREE.Group(); this.eyeL.position.set(-0.35, 1.35, 0.95); this.group.add(this.eyeL);
                this.eyeR = new THREE.Group(); this.eyeR.position.set(0.35, 1.35, 0.95); this.group.add(this.eyeR);

                const eyeMeshGeo = new THREE.ConeGeometry(0.12, 0.35, 4); 
                
                const leftEyePiece = new THREE.Mesh(eyeMeshGeo, matEyeBase);
                leftEyePiece.rotation.z = -Math.PI / 2 - 0.35; // Invertido para o lado agressivo correto
                this.eyeL.add(leftEyePiece);

                const rightEyePiece = new THREE.Mesh(eyeMeshGeo, matEyeBase);
                rightEyePiece.rotation.z = Math.PI / 2 + 0.35; // Invertido para o lado agressivo correto
                this.eyeR.add(rightEyePiece);

                const pupilGeo = new THREE.BoxGeometry(0.04, 0.18, 0.08);
                const pupilL = new THREE.Mesh(pupilGeo, matEyePupil); pupilL.position.set(0, 0, 0.05); this.eyeL.add(pupilL);
                const pupilR = new THREE.Mesh(pupilGeo, matEyePupil); pupilR.position.set(0, 0, 0.05); this.eyeR.add(pupilR);

                // BOCA AMEAÇADORA (Formato de Arco Predador com mandíbula)
                this.mouthGroup = new THREE.Group();
                this.mouthGroup.position.set(0, 0.85, 1.02);
                this.mouthGroup.scale.set(0, 0, 0); 
                this.group.add(this.mouthGroup);

                // Fundo da boca em arco curvo
                const mouthBgGeo = new THREE.CylinderGeometry(0.3, 0.25, 0.15, 12, 1, false, 0, Math.PI);
                const mouthBgMat = new THREE.MeshBasicMaterial({color: 0x0a0000, side: THREE.DoubleSide});
                this.mouthBg = new THREE.Mesh(mouthBgGeo, mouthBgMat);
                this.mouthBg.rotation.z = Math.PI; // Curva para cima num sorriso sádico
                this.mouthGroup.add(this.mouthBg);

                this.topTeeth = new THREE.Group();
                this.botTeeth = new THREE.Group();
                this.mouthGroup.add(this.topTeeth);
                this.mouthGroup.add(this.botTeeth);

                const toothGeo = new THREE.ConeGeometry(0.035, 0.12, 4);
                const toothMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
                for(let i = -2; i <= 2; i++) {
                    const topTooth = new THREE.Mesh(toothGeo, toothMat);
                    topTooth.position.set(i * 0.09, 0.06, 0.04);
                    topTooth.rotation.x = Math.PI; 
                    this.topTeeth.add(topTooth);
                    
                    const botTooth = new THREE.Mesh(toothGeo, toothMat);
                    botTooth.position.set(i * 0.09, -0.06, 0.04);
                    this.botTeeth.add(botTooth);
                }

                this.mouthOpenAmount = 0;

                this.group.scale.setScalar(this.baseScale);
                scene.add(this.group);
                
                this.state = 'idle';
                this.timer = Math.random() * 2;
                this.trailTimer = 0;
                this.velocityY = 0;
                this.hp = Math.floor(this.baseScale * 3); 
                this.isDead = false;
                this.flashTimer = 0;
                this.knockback = new THREE.Vector3();
                this.targetRotation = Math.random() * Math.PI * 2;
            }

            takeDamage(clickSourcePos) {
                if (this.isDead) return;
                this.hp--;
                this.state = 'hurt';
                this.flashTimer = 0.15;
                this.body.material = matFlashWhite; 

                const dir = new THREE.Vector3().subVectors(this.group.position, clickSourcePos).normalize();
                this.knockback.set(dir.x * 8, 5, dir.z * 8);
                this.velocityY = 8;
                
                spawnVFX(this.group.position.clone().setY(this.baseScale), 10, this.color);

                if (this.hp <= 0) {
                    this.die();
                }
            }

            die() {
                this.isDead = true;
                spawnVFX(this.group.position.clone().setY(this.baseScale), 50, this.color);
                spawnTrail(this.group.position.x, this.group.position.z, this.color, this.baseScale * 5); 
                scene.remove(this.group);
            }

            update(delta) {
                if (this.isDead) return;

                if (this.flashTimer > 0) {
                    this.flashTimer -= delta;
                    if (this.flashTimer <= 0) this.body.material = this.baseMat;
                }

                this.bubbles.forEach(b => {
                    b.angle += b.speed * delta;
                    b.mesh.position.x = Math.sin(b.angle) * b.dist;
                    b.mesh.position.z = Math.cos(b.angle) * b.dist;
                    b.mesh.position.y = 1.0 + Math.sin(b.angle * 2) * 0.2;
                });
                
                let diff = this.targetRotation - this.group.rotation.y;
                while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
                this.group.rotation.y += diff * 4 * delta;

                let targetMouthScale = 0.0; 

                if (this.state !== 'jump') {
                    this.trailTimer -= delta;
                    if (this.trailTimer <= 0) {
                        spawnTrail(this.group.position.x, this.group.position.z, this.color, this.baseScale * 1.5);
                        this.trailTimer = 0.2;
                    }
                }

                if (this.state === 'idle') {
                    targetMouthScale = 0.0; 
                    
                    const pulse = 1.0 + Math.sin(Date.now() * 0.003 + this.group.uuid.charCodeAt(0)) * 0.08;
                    this.body.scale.set(pulse, 1/pulse, pulse);
                    
                    this.timer -= delta;
                    if (this.timer <= 0) {
                        const distFromCenter = Math.hypot(this.group.position.x, this.group.position.z);
                        if (distFromCenter > 25) {
                            this.targetRotation = Math.atan2(-this.group.position.x, -this.group.position.z) + (Math.random() - 0.5);
                        } else {
                            this.targetRotation = this.group.rotation.y + (Math.random() - 0.5) * 2.0;
                        }
                        
                        this.state = 'charge';
                        this.timer = 0.4 + Math.random() * 0.4;
                    }
                } 
                else if (this.state === 'charge') {
                    targetMouthScale = 0.0; 
                    
                    this.body.scale.set(1.4, 0.5, 1.4);
                    this.timer -= delta;
                    if (this.timer <= 0) {
                        this.state = 'jump'; 
                        this.velocityY = 10 + Math.random() * 6; 
                        const jumpDir = new THREE.Vector3(Math.sin(this.targetRotation), 0, Math.cos(this.targetRotation));
                        this.knockback.copy(jumpDir.multiplyScalar(3 + Math.random() * 4)); 
                    }
                }
                else if (this.state === 'jump' || this.state === 'hurt') {
                    targetMouthScale = 1.0; 
                    
                    this.body.scale.set(0.7, 1.4, 0.7);
                    
                    this.velocityY -= 30 * delta; 
                    this.group.position.y += this.velocityY * delta;
                    this.group.position.x += this.knockback.x * delta;
                    this.group.position.z += this.knockback.z * delta;

                    if (this.group.position.y <= 0) {
                        this.group.position.y = 0;
                        this.velocityY = 0;
                        this.knockback.set(0,0,0);
                        this.state = 'idle';
                        this.timer = 0.5 + Math.random() * 2; 
                        
                        this.body.scale.set(1.6, 0.4, 1.6); 
                        spawnTrail(this.group.position.x, this.group.position.z, this.color, this.baseScale * 2.2); 
                    }
                }

                this.mouthOpenAmount += (targetMouthScale - this.mouthOpenAmount) * 18 * delta;
                this.mouthGroup.scale.setScalar(this.mouthOpenAmount);

                const faceYOffset = (this.body.scale.y - 1.0) * 0.8; 
                this.eyeL.position.y = 1.35 + faceYOffset;
                this.eyeR.position.y = 1.35 + faceYOffset;
                this.mouthGroup.position.y = 0.85 + faceYOffset;

                if (this.state === 'idle') {
                    this.body.scale.x += (1.0 - this.body.scale.x) * 10 * delta;
                    this.body.scale.y += (1.0 - this.body.scale.y) * 10 * delta;
                    this.body.scale.z += (1.0 - this.body.scale.z) * 10 * delta;
                }
            }
        }

        // --- 7. SPAWN INICIAL ---
        function spawnInitialSlimes() {
            slimes.push(new Slime(0, 0));
        }
        spawnInitialSlimes();

        // --- 8. INTERAÇÃO ---
        document.getElementById('add-slime-btn').addEventListener('click', () => {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 15;
            slimes.push(new Slime(Math.cos(angle)*radius, Math.sin(angle)*radius));
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                const btn = document.getElementById('add-slime-btn');
                btn.style.display = (btn.style.display === 'none') ? 'block' : 'none';
            }
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const slimeBodies = slimes.map(s => s.body);
            const intersects = raycaster.intersectObjects(slimeBodies);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const slimeHit = slimes.find(s => s.body === hitMesh);
                if (slimeHit) {
                    slimeHit.takeDamage(camera.position);
                }
            }
        });

        // --- 9. LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            for (let i = slimes.length - 1; i >= 0; i--) {
                const slime = slimes[i];
                slime.update(delta);
                if (slime.isDead) {
                    slimes.splice(i, 1);
                }
            }

            for (let i = slimeTrails.length - 1; i >= 0; i--) {
                const t = slimeTrails[i];
                t.life -= delta * 0.2; 
                t.mesh.material.opacity = t.life * 0.7;
                t.mesh.scale.setScalar(t.maxSize * (1.0 + (1.0 - t.life) * 0.15)); 
                if (t.life <= 0) {
                    scene.remove(t.mesh);
                    slimeTrails.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.userData.life -= delta * 1.5;
                p.position.add(p.userData.vel.clone().multiplyScalar(delta));
                p.position.y -= delta * 10; 
                p.scale.setScalar(Math.max(0, p.userData.life * 1.5)); 
                if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
        
        animate();
    </script>
</body>
</html>
